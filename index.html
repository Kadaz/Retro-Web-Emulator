<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retro Web Emulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }

        .app {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 0 0 15px 0;
            text-align: center;
        }


        /* ==================================================
           SYSTEM BUTTONS
           ================================================== */

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .tabs button {
            padding: 11px 16px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .tabs button:hover {
            background: #383838;
        }

        .tabs button.active {
            background: #555;
            outline: 2px solid #aaa;
        }


        /* ==================================================
           PANEL
           ================================================== */

        .panel {
            background: #191919;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
        }


        /* ==================================================
           ROM ROW
           ================================================== */

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        input,
        button {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        input {
            background: #222;
            color: white;
            border: 1px solid #555;
            flex: 1;
            min-width: 260px;
        }

        button {
            background: #292929;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }

        button:hover {
            background: #383838;
        }


        /* ==================================================
           STATUS
           ================================================== */

        #status {
            color: #bbb;
            min-height: 24px;
            padding: 8px 0;
        }


        /* ==================================================
           EMULATOR AREA
           ================================================== */

        .screen {
            background: #000;
            margin-top: 12px;
            width: 100%;
            position: relative;

            /*
            IMPORTANT:
            Leave room for EmulatorJS controls.
            */

            padding-bottom: 90px;

            overflow: visible;
        }

        #game {
            width: 100%;

            /*
            Slightly smaller than before so the
            bottom EmulatorJS controls have room.
            */

            height: calc(100vh - 300px);

            min-height: 480px;

            position: relative;

            overflow: visible;
        }


        /* ==================================================
           INFORMATION
           ================================================== */

        .info {
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }


        /* ==================================================
           SMALL SCREENS
           ================================================== */

        @media (max-width: 700px) {

            .app {
                padding: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 5px;
            }

            .tabs button {
                padding: 9px 10px;
                font-size: 12px;
            }

            #game {
                height: calc(100vh - 300px);
                min-height: 400px;
            }

            .screen {
                padding-bottom: 80px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <h1>
        Retro Web Emulator
    </h1>


    <!-- ==================================================
         SYSTEM SELECTION
         ================================================== -->

    <div class="tabs">

        <button data-system="snes">
            SNES
        </button>

        <button data-system="nes">
            NES
        </button>

        <button data-system="segaMS">
            Master System
        </button>

        <button data-system="segaMD">
            Mega Drive / Genesis
        </button>

        <button data-system="segaGG">
            Game Gear
        </button>

        <button data-system="gb">
            Game Boy
        </button>

        <button data-system="gbc">
            Game Boy Color
        </button>

        <button data-system="gba">
            Game Boy Advance
        </button>

    </div>


    <!-- ==================================================
         MAIN PANEL
         ================================================== -->

    <div class="panel">


        <!-- ROM INPUT -->

        <div class="row">

            <input
                id="romUrl"
                type="text"
                placeholder="ROM path, e.g. roms/super-metroid.sfc"
                autocomplete="off"
            >

            <button id="load">
                Load ROM
            </button>

            <button id="reset">
                Reset
            </button>

        </div>


        <!-- STATUS -->

        <div id="status">
            Choose a system and enter a ROM path.
        </div>


        <!-- ==================================================
             EMULATOR
             ================================================== -->

        <div class="screen">

            <div id="game"></div>

        </div>


        <p class="info">

            Keyboard and compatible gamepads are handled by
            EmulatorJS. Save data is handled by the emulator/core.

        </p>


    </div>


</div>


<script>


/*
============================================================
RETRO WEB EMULATOR
============================================================
*/


let selectedSystem = "snes";

let emulatorStarted = false;


/*
============================================================
ELEMENTS
============================================================
*/

const status =
    document.getElementById("status");

const romUrl =
    document.getElementById("romUrl");

const gameContainer =
    document.getElementById("game");


/*
============================================================
SYSTEM INFORMATION
============================================================
*/

const systems = {

    snes: {

        name: "Super Nintendo / SNES",

        core: "snes",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".gd3",
            ".gd7",
            ".dx2",
            ".bsx",
            ".swc"
        ]

    },


    nes: {

        name: "Nintendo Entertainment System / NES",

        core: "nes",

        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]

    },


    segaMS: {

        name: "Sega Master System",

        core: "segaMS",

        extensions: [
            ".sms"
        ]

    },


    segaMD: {

        name: "Sega Mega Drive / Genesis",

        core: "segaMD",

        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]

    },


    segaGG: {

        name: "Sega Game Gear",

        core: "segaGG",

        extensions: [
            ".gg"
        ]

    },


    gb: {

        name: "Nintendo Game Boy",

        core: "gb",

        extensions: [
            ".gb"
        ]

    },


    gbc: {

        name: "Nintendo Game Boy Color",

        core: "gbc",

        extensions: [
            ".gbc"
        ]

    },


    gba: {

        name: "Nintendo Game Boy Advance",

        core: "gba",

        extensions: [
            ".gba"
        ]

    }

};


/*
============================================================
SYSTEM BUTTONS
============================================================
*/

document
    .querySelectorAll("[data-system]")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll("[data-system]")
                    .forEach(function(btn) {

                        btn.classList.remove("active");

                    });


                button.classList.add("active");


                selectedSystem =
                    button.dataset.system;


                const system =
                    systems[selectedSystem];


                status.textContent =
                    "Selected " +
                    system.name +
                    ".";


                romUrl.value = "";

            }
        );

    });


/*
============================================================
DEFAULT SYSTEM
============================================================
*/

document
    .querySelector('[data-system="snes"]')
    .classList.add("active");


/*
============================================================
GET ABSOLUTE ROM URL
============================================================
*/

function getRomUrl() {

    const value =
        romUrl.value.trim();


    if (!value) {

        return "";

    }


    return new URL(
        value,
        window.location.href
    ).href;

}


/*
============================================================
CHECK ROM EXTENSION
============================================================
*/

function checkExtension(url) {

    const system =
        systems[selectedSystem];


    const cleanUrl =
        url
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


    return system.extensions.some(
        function(extension) {

            return cleanUrl.endsWith(extension);

        }
    );

}


/*
============================================================
START EMULATORJS
============================================================
*/

function loadEmulator(romUrlValue) {

    const system =
        systems[selectedSystem];


    status.textContent =
        "Starting " +
        system.name +
        " emulator...";


    /*
    ========================================================
    EmulatorJS configuration
    ========================================================
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        romUrlValue;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    /*
    ========================================================
    Clear emulator container
    ========================================================
    */

    gameContainer.innerHTML = "";


    /*
    ========================================================
    Remove previous loader
    ========================================================
    */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
    ========================================================
    Load EmulatorJS
    ========================================================
    */

    const script =
        document.createElement("script");


    script.id =
        "emulatorjs-loader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            emulatorStarted = true;


            status.textContent =
                system.name +
                " emulator started.";

        };


    script.onerror =
        function() {

            status.textContent =
                "Could not load EmulatorJS.";

        };


    document.body.appendChild(script);

}


/*
============================================================
LOAD ROM
============================================================
*/

document
    .getElementById("load")
    .addEventListener(
        "click",
        async function() {


            const value =
                romUrl.value.trim();


            if (!value) {

                status.textContent =
                    "Enter a ROM path first.";

                return;

            }


            const absoluteUrl =
                getRomUrl();


            const system =
                systems[selectedSystem];


            /*
            =================================================
            Extension check
            =================================================
            */

            if (!checkExtension(absoluteUrl)) {

                status.textContent =
                    "Warning: ROM extension does not normally " +
                    "belong to " +
                    system.name +
                    ". Trying anyway...";

            }
            else {

                status.textContent =
                    "Checking ROM...";

            }


            /*
            =================================================
            Try HEAD
            =================================================
            */

            try {

                const response =
                    await fetch(
                        absoluteUrl,
                        {
                            method: "HEAD",
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                status.textContent =
                    "ROM found. Starting emulator...";


                loadEmulator(
                    absoluteUrl
                );


            }
            catch (headError) {


                /*
                =================================================
                Try GET if HEAD is not supported.
                =================================================
                */

                try {

                    const response =
                        await fetch(
                            absoluteUrl,
                            {
                                method: "GET",
                                cache: "no-store"
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    status.textContent =
                        "ROM found. Starting emulator...";


                    loadEmulator(
                        absoluteUrl
                    );


                }
                catch (getError) {

                    status.innerHTML =
                        "Could not load ROM.<br><br>" +
                        "<small>" +
                        getError.message +
                        "</small>";

                }

            }

        }
    );


/*
============================================================
RESET
============================================================
*/

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/*
============================================================
ENTER KEY IN ROM INPUT
============================================================
*/

romUrl.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            document
                .getElementById("load")
                .click();

        }

    }
);


/*
============================================================
KEYBOARD FIX
============================================================

The browser must not scroll the page when the arrow keys
are used.

We prevent the browser's default action but do NOT stop
event propagation, so EmulatorJS can still receive the keys.

============================================================
*/

const emulatorKeys = new Set([

    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",

    "Enter",
    "Shift",

    "Control",
    "Alt",

    "z",
    "x",
    "a",
    "s",

    "Z",
    "X",
    "A",
    "S",

    " "

]);


/*
============================================================
KEY DOWN
============================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        /*
        Do not interfere while typing the ROM path.
        */

        if (
            document.activeElement === romUrl
        ) {

            return;

        }


        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
KEY UP
============================================================
*/

document.addEventListener(
    "keyup",
    function(event) {

        /*
        Do not interfere while typing the ROM path.
        */

        if (
            document.activeElement === romUrl
        ) {

            return;

        }


        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


</script>

</body>

</html>
