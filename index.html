<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Retro Web Emulator</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    background: #111;
    color: #eee;

    font-family: Arial, sans-serif;

}

body {

    min-height: 100vh;

}


/* =========================================================
   MAIN APP
   ========================================================= */

.app {

    max-width: 1100px;

    margin: auto;

    padding: 18px;

}


h1 {

    margin:
        0
        0
        15px
        0;

    text-align: center;

}


/* =========================================================
   SYSTEM BUTTONS
   ========================================================= */

.tabs {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    justify-content: center;

    margin: 15px 0;

}


.tabs button {

    padding:
        11px
        16px;

    border-radius: 6px;

    border:
        1px
        solid
        #666;

    background: #292929;

    color: white;

    cursor: pointer;

}


.tabs button:hover {

    background: #383838;

}


.tabs button.active {

    background: #555;

    outline:
        2px
        solid
        #aaa;

}


/* =========================================================
   PANEL
   ========================================================= */

.panel {

    background: #191919;

    border:
        1px
        solid
        #444;

    padding: 14px;

    border-radius: 8px;

}


/* =========================================================
   ROM SELECTOR
   ========================================================= */

.row {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin: 10px 0;

}


select,
button {

    padding: 10px;

    border-radius: 6px;

    font-size: 14px;

}


select {

    background: #222;

    color: white;

    border:
        1px
        solid
        #555;

    flex: 1;

    min-width: 300px;

}


button {

    background: #292929;

    color: white;

    border:
        1px
        solid
        #666;

    cursor: pointer;

}


button:hover {

    background: #383838;

}


/* =========================================================
   STATUS
   ========================================================= */

#status {

    color: #bbb;

    min-height: 24px;

    padding: 8px 0;

}


/* =========================================================
   EMULATOR
   ========================================================= */

/*
IMPORTANT:

EmulatorJS gets the full browser width.

This prevents its bottom controls and volume
slider from being squeezed into the 1100px panel.
*/

.screen {

    background: #000;

    margin-top: 12px;

    width: 100vw;

    margin-left:
        calc(50% - 50vw);

    position: relative;

    overflow: visible;

}


#game {

    width: 100%;

    height:
        calc(100vh - 45px);

    min-height: 480px;

    position: relative;

    overflow: visible;

}


/* =========================================================
   INFORMATION
   ========================================================= */

.info {

    color: #999;

    font-size: 13px;

    line-height: 1.5;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .app {

        padding: 8px;

    }


    h1 {

        font-size: 22px;

    }


    .tabs {

        gap: 5px;

    }


    .tabs button {

        padding:
            9px
            10px;

        font-size: 12px;

    }


    select {

        min-width: 200px;

    }


    #game {

        height:
            calc(100vh - 45px);

        min-height: 400px;

    }

}

</style>

</head>


<body>


<div class="app">


<h1>
    Retro Web Emulator
</h1>


<!-- =====================================================
     SYSTEM SELECTION
     ===================================================== -->

<div class="tabs">

<button data-system="snes">
    SNES
</button>

<button data-system="nes">
    NES
</button>

<button data-system="segaMS">
    Master System
</button>

<button data-system="segaMD">
    Mega Drive / Genesis
</button>

<button data-system="segaGG">
    Game Gear
</button>

<button data-system="gb">
    Game Boy
</button>

<button data-system="gbc">
    Game Boy Color
</button>

<button data-system="gba">
    Game Boy Advance
</button>

</div>


<!-- =====================================================
     MAIN PANEL
     ===================================================== -->

<div class="panel">


<div class="row">


<select id="romSelect">

<option value="">
    Scanning GitHub roms folder...
</option>

</select>


<button id="load">
    Load ROM
</button>


<button id="reset">
    Reset
</button>


</div>


<div id="status">

Scanning GitHub repository for ROMs...

</div>


<!-- =====================================================
     EMULATOR
     ===================================================== -->

<div class="screen">

<div id="game"></div>

</div>


<p class="info">

ROMs are automatically detected from the
<strong>roms</strong> folder of the GitHub repository.

</p>


</div>


</div>


<script>


/* ========================================================
   CONFIGURATION
   ======================================================== */


/*
GitHub repository.

Your GitHub Pages address is:

https://kadaz.github.io/retro-test/

Therefore the repository is:

kadaz / retro-test
*/

const GITHUB_OWNER =
    "kadaz";

const GITHUB_REPO =
    "retro-test";

const ROM_FOLDER =
    "roms";


let selectedSystem =
    "snes";


let romDatabase =
    {};


/* ========================================================
   ELEMENTS
   ======================================================== */

const status =
    document.getElementById(
        "status"
    );


const romSelect =
    document.getElementById(
        "romSelect"
    );


const gameContainer =
    document.getElementById(
        "game"
    );


/* ========================================================
   SYSTEM INFORMATION
   ======================================================== */

const systems = {

    snes: {

        name:
            "Super Nintendo / SNES",

        core:
            "snes",

        extensions:
            [
                ".sfc",
                ".smc",
                ".fig",
                ".swc"
            ]

    },


    nes: {

        name:
            "Nintendo Entertainment System / NES",

        core:
            "nes",

        extensions:
            [
                ".nes",
                ".fds"
            ]

    },


    segaMS: {

        name:
            "Sega Master System",

        core:
            "segaMS",

        extensions:
            [
                ".sms"
            ]

    },


    segaMD: {

        name:
            "Sega Mega Drive / Genesis",

        core:
            "segaMD",

        extensions:
            [
                ".md",
                ".gen",
                ".smd",
                ".bin"
            ]

    },


    segaGG: {

        name:
            "Sega Game Gear",

        core:
            "segaGG",

        extensions:
            [
                ".gg"
            ]

    },


    gb: {

        name:
            "Nintendo Game Boy",

        core:
            "gb",

        extensions:
            [
                ".gb"
            ]

    },


    gbc: {

        name:
            "Nintendo Game Boy Color",

        core:
            "gbc",

        extensions:
            [
                ".gbc"
            ]

    },


    gba: {

        name:
            "Nintendo Game Boy Advance",

        core:
            "gba",

        extensions:
            [
                ".gba"
            ]

    }

};


/* ========================================================
   CHECK ROM EXTENSION
   ======================================================== */

function belongsToSystem(
    filename,
    systemId
) {

    const system =
        systems[systemId];


    const lower =
        filename.toLowerCase();


    return system.extensions.some(
        function(extension) {

            return lower.endsWith(
                extension
            );

        }
    );

}


/* ========================================================
   GITHUB ROM SCANNER
   ======================================================== */

/*
GitHub Pages cannot run PHP.

Instead we ask the GitHub API:

GET
https://api.github.com/repos/kadaz/retro-test/contents/roms

GitHub returns the actual files inside roms/.
*/

async function scanGitHubRoms() {


    status.textContent =
        "Scanning GitHub roms folder...";


    const apiUrl =
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPO +
        "/contents/" +
        ROM_FOLDER;


    try {


        const response =
            await fetch(
                apiUrl,
                {
                    cache:
                        "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "GitHub did not return a file list."
            );

        }


        /*
        ================================================
        Create database
        ================================================
        */

        romDatabase = {};


        Object.keys(
            systems
        ).forEach(
            function(systemId) {

                romDatabase[
                    systemId
                ] = [];

            }
        );


        /*
        ================================================
        Process every file
        ================================================
        */

        files.forEach(
            function(file) {


                /*
                Only actual files.
                */

                if (
                    file.type !==
                    "file"
                ) {

                    return;

                }


                /*
                Check which system
                this ROM belongs to.
                */

                Object.keys(
                    systems
                ).forEach(
                    function(systemId) {


                        if (
                            belongsToSystem(
                                file.name,
                                systemId
                            )
                        ) {


                            /*
                            Use GitHub Pages URL.

                            Example:

                            roms/super-metroid.sfc
                            */

                            const romUrl =
                                ROM_FOLDER +
                                "/" +
                                encodeURIComponent(
                                    file.name
                                );


                            romDatabase[
                                systemId
                            ].push({

                                name:
                                    file.name,

                                url:
                                    romUrl

                            });

                        }

                    }
                );

            }
        );


        /*
        ================================================
        Sort each system
        ================================================
        */

        Object.keys(
            romDatabase
        ).forEach(
            function(systemId) {


                romDatabase[
                    systemId
                ].sort(
                    function(a, b) {

                        return a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                numeric:
                                    true,

                                sensitivity:
                                    "base"
                            }
                        );

                    }
                );

            }
        );


        /*
        ================================================
        Update UI
        ================================================
        */

        filterRomList();


        let total =
            0;


        Object.keys(
            romDatabase
        ).forEach(
            function(systemId) {

                total +=
                    romDatabase[
                        systemId
                    ].length;

            }
        );


        status.textContent =
            "✓ GitHub scan complete. Found " +
            total +
            " ROM(s).";


    }
    catch (error) {


        romSelect.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.value =
            "";


        option.textContent =
            "Could not scan GitHub ROMs";


        romSelect.appendChild(
            option
        );


        status.innerHTML =
            "✗ Could not scan GitHub roms folder.<br>" +
            "<small>" +
            error.message +
            "</small>";

    }

}


/* ========================================================
   FILTER ROM LIST
   ======================================================== */

function filterRomList() {


    romSelect.innerHTML =
        "";


    const placeholder =
        document.createElement(
            "option"
        );


    placeholder.value =
        "";


    placeholder.textContent =
        "-- Select " +
        systems[
            selectedSystem
        ].name +
        " ROM --";


    romSelect.appendChild(
        placeholder
    );


    const roms =
        romDatabase[
            selectedSystem
        ] || [];


    roms.forEach(
        function(rom) {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rom.url;


            option.textContent =
                rom.name;


            romSelect.appendChild(
                option
            );

        }
    );


    status.textContent =
        "Found " +
        roms.length +
        " " +
        systems[
            selectedSystem
        ].name +
        " ROM(s).";

}


/* ========================================================
   START EMULATORJS
   ======================================================== */

function startEmulator(
    romUrl
) {


    const system =
        systems[
            selectedSystem
        ];


    status.textContent =
        "Starting " +
        system.name +
        "...";


    /*
    ====================================================
    EmulatorJS configuration
    ====================================================
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        new URL(
            romUrl,
            window.location.href
        ).href;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    /*
    ====================================================
    Clear previous emulator
    ====================================================
    */

    gameContainer.innerHTML =
        "";


    /*
    ====================================================
    Remove previous loader
    ====================================================
    */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
    ====================================================
    Load EmulatorJS
    ====================================================
    */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            status.textContent =
                "✓ " +
                system.name +
                " loaded.";

        };


    script.onerror =
        function() {

            status.textContent =
                "✗ Could not load EmulatorJS.";

        };


    document.body.appendChild(
        script
    );

}


/* ========================================================
   LOAD BUTTON
   ======================================================== */

document
    .getElementById("load")
    .addEventListener(
        "click",
        function() {


            const rom =
                romSelect.value;


            if (!rom) {

                status.textContent =
                    "Select a ROM first.";

                return;

            }


            startEmulator(
                rom
            );

        }
    );


/* ========================================================
   DOUBLE CLICK ROM
   ======================================================== */

romSelect.addEventListener(
    "dblclick",
    function() {


        const rom =
            romSelect.value;


        if (!rom) {

            return;

        }


        startEmulator(
            rom
        );

    }
);


/* ========================================================
   RESET
   ======================================================== */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* ========================================================
   SYSTEM BUTTONS
   ======================================================== */

document
    .querySelectorAll(
        "[data-system]"
    )
    .forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            "[data-system]"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedSystem =
                        button.dataset.system;


                    filterRomList();

                }
            );

        }
    );


/* ========================================================
   DEFAULT SYSTEM
   ======================================================== */

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add(
        "active"
    );


/* ========================================================
   KEYBOARD FIX
   ======================================================== */

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


/* ========================================================
   KEY DOWN
   ======================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/* ========================================================
   KEY UP
   ======================================================== */

document.addEventListener(
    "keyup",
    function(event) {


        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/* ========================================================
   START
   ======================================================== */

scanGitHubRoms();


</script>

</body>

</html>
