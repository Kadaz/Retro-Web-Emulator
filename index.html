<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Retro Web Emulator</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
}

.app {
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

h1 {
    margin: 0 0 15px;
    text-align: center;
}


/* =========================================================
   SYSTEM BUTTONS
   ========================================================= */

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 15px 0;
}

.tabs button {
    padding: 11px 16px;
    border-radius: 6px;
    border: 1px solid #666;
    background: #292929;
    color: white;
    cursor: pointer;
}

.tabs button:hover {
    background: #383838;
}

.tabs button.active {
    background: #555;
    outline: 2px solid #aaa;
}


/* =========================================================
   PANEL
   ========================================================= */

.panel {
    background: #191919;
    border: 1px solid #444;
    padding: 14px;
    border-radius: 8px;
}


/* =========================================================
   ROM SELECTOR
   ========================================================= */

.row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
}

select,
button {
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
}

select {
    background: #222;
    color: white;
    border: 1px solid #555;
    flex: 1;
    min-width: 300px;
}

button {
    background: #292929;
    color: white;
    border: 1px solid #666;
    cursor: pointer;
}

button:hover {
    background: #383838;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
    color: #bbb;
    min-height: 24px;
    padding: 8px 0;
}


/* =========================================================
   EMULATOR
   ========================================================= */

.screen {
    background: #000;

    width: 100vw;

    margin-left: calc(50% - 50vw);

    margin-top: 12px;

    position: relative;

    overflow: visible;
}

#game {
    width: 100%;

    height: calc(100vh - 45px);

    min-height: 480px;

    position: relative;

    overflow: visible;
}


/* =========================================================
   INFORMATION
   ========================================================= */

.info {
    color: #999;
    font-size: 13px;
    line-height: 1.5;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .app {
        padding: 8px;
    }

    h1 {
        font-size: 22px;
    }

    .tabs {
        gap: 5px;
    }

    .tabs button {
        padding: 9px 10px;
        font-size: 12px;
    }

    select {
        min-width: 200px;
    }

    #game {
        height: calc(100vh - 45px);
        min-height: 400px;
    }

}

</style>

</head>


<body>


<div class="app">


<h1>
    Retro Web Emulator
</h1>


<!-- =====================================================
     SYSTEM SELECTION
     ===================================================== -->

<div class="tabs">

<button data-system="snes">
    SNES
</button>

<button data-system="nes">
    NES
</button>

<button data-system="segaMS">
    Master System
</button>

<button data-system="segaMD">
    Mega Drive / Genesis
</button>

<button data-system="segaGG">
    Game Gear
</button>

<button data-system="gb">
    Game Boy
</button>

<button data-system="gbc">
    Game Boy Color
</button>

<button data-system="gba">
    Game Boy Advance
</button>

</div>


<!-- =====================================================
     MAIN PANEL
     ===================================================== -->

<div class="panel">


<div class="row">

<select id="romSelect">

<option value="">
    Scanning ROMs...
</option>

</select>

<button id="load">
    Load ROM
</button>

<button id="reset">
    Reset
</button>

</div>


<div id="status">

Scanning GitHub ROM folder...

</div>


<!-- =====================================================
     EMULATOR
     ===================================================== -->

<div class="screen">

<div id="game"></div>

</div>


<p class="info">

ROMs are automatically detected from the
<strong>roms</strong> folder.

</p>


</div>


</div>


<script>


/* ========================================================
   GITHUB CONFIGURATION
   ======================================================== */

const GITHUB_OWNER =
    "kadaz";

const GITHUB_REPOSITORY =
    "Retro-Web-Emulator";

const ROM_FOLDER =
    "roms";


/* ========================================================
   STATE
   ======================================================== */

let selectedSystem =
    "snes";

let romDatabase = {};


/* ========================================================
   ELEMENTS
   ======================================================== */

const status =
    document.getElementById("status");

const romSelect =
    document.getElementById("romSelect");

const gameContainer =
    document.getElementById("game");


/* ========================================================
   SYSTEM INFORMATION
   ======================================================== */

const systems = {

    snes: {

        name:
            "Super Nintendo / SNES",

        core:
            "snes",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".swc"
        ]

    },


    nes: {

        name:
            "Nintendo Entertainment System / NES",

        core:
            "nes",

        extensions: [
            ".nes",
            ".fds"
        ]

    },


    segaMS: {

        name:
            "Sega Master System",

        core:
            "segaMS",

        extensions: [
            ".sms"
        ]

    },


    segaMD: {

        name:
            "Sega Mega Drive / Genesis",

        core:
            "segaMD",

        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]

    },


    segaGG: {

        name:
            "Sega Game Gear",

        core:
            "segaGG",

        extensions: [
            ".gg"
        ]

    },


    /* =====================================================
       GAME BOY

       IMPORTANT:
       Game Boy and Game Boy Color both use Gambatte.
       ===================================================== */

    gb: {

        name:
            "Nintendo Game Boy",

        core:
            "gambatte",

        extensions: [
            ".gb"
        ]

    },


    /* =====================================================
       GAME BOY COLOR

       FIX:
       Use gambatte instead of gbc.
       ===================================================== */

    gbc: {

        name:
            "Nintendo Game Boy Color",

        core:
            "gambatte",

        extensions: [
            ".gbc"
        ]

    },


    gba: {

        name:
            "Nintendo Game Boy Advance",

        core:
            "gba",

        extensions: [
            ".gba"
        ]

    }

};


/* ========================================================
   CHECK ROM EXTENSION
   ======================================================== */

function isSystemRom(
    filename,
    systemId
) {

    const lowerName =
        filename.toLowerCase();

    return systems[
        systemId
    ].extensions.some(
        function(extension) {

            return lowerName.endsWith(
                extension
            );

        }
    );

}


/* ========================================================
   SCAN GITHUB ROM FOLDER
   ======================================================== */

async function scanRoms() {

    status.textContent =
        "Scanning GitHub roms folder...";


    const apiUrl =
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPOSITORY +
        "/contents/" +
        ROM_FOLDER;


    try {

        const response =
            await fetch(
                apiUrl,
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API returned HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "GitHub did not return a file list."
            );

        }


        romDatabase = {};


        Object.keys(
            systems
        ).forEach(
            function(systemId) {

                romDatabase[
                    systemId
                ] = [];

            }
        );


        files.forEach(
            function(file) {

                if (
                    file.type !==
                    "file"
                ) {

                    return;

                }


                Object.keys(
                    systems
                ).forEach(
                    function(systemId) {

                        if (
                            isSystemRom(
                                file.name,
                                systemId
                            )
                        ) {

                            romDatabase[
                                systemId
                            ].push({

                                name:
                                    file.name,

                                url:
                                    ROM_FOLDER +
                                    "/" +
                                    encodeURIComponent(
                                        file.name
                                    )

                            });

                        }

                    }
                );

            }
        );


        Object.keys(
            romDatabase
        ).forEach(
            function(systemId) {

                romDatabase[
                    systemId
                ].sort(
                    function(a, b) {

                        return a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                numeric: true,
                                sensitivity: "base"
                            }
                        );

                    }
                );

            }
        );


        filterRoms();


        let total =
            0;


        Object.keys(
            romDatabase
        ).forEach(
            function(systemId) {

                total +=
                    romDatabase[
                        systemId
                    ].length;

            }
        );


        status.textContent =
            "✓ Found " +
            total +
            " ROM(s) automatically.";


    }
    catch (error) {

        romSelect.innerHTML =
            "";


        const option =
            document.createElement(
                "option"
            );


        option.value =
            "";


        option.textContent =
            "Could not scan ROMs";


        romSelect.appendChild(
            option
        );


        status.innerHTML =
            "✗ Could not scan GitHub roms folder.<br>" +
            "<small>" +
            error.message +
            "</small>";

    }

}


/* ========================================================
   FILTER ROM LIST
   ======================================================== */

function filterRoms() {

    romSelect.innerHTML =
        "";


    const placeholder =
        document.createElement(
            "option"
        );


    placeholder.value =
        "";


    placeholder.textContent =
        "-- Select " +
        systems[
            selectedSystem
        ].name +
        " ROM --";


    romSelect.appendChild(
        placeholder
    );


    const roms =
        romDatabase[
            selectedSystem
        ] || [];


    roms.forEach(
        function(rom) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rom.url;


            option.textContent =
                rom.name;


            romSelect.appendChild(
                option
            );

        }
    );


    status.textContent =
        "Found " +
        roms.length +
        " " +
        systems[
            selectedSystem
        ].name +
        " ROM(s).";

}


/* ========================================================
   START EMULATORJS
   ======================================================== */

function startEmulator(
    rom
) {

    const system =
        systems[
            selectedSystem
        ];


    status.textContent =
        "Starting " +
        system.name +
        "...";


    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        new URL(
            rom,
            window.location.href
        ).href;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    gameContainer.innerHTML =
        "";


    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            status.textContent =
                "✓ " +
                system.name +
                " loaded.";

        };


    script.onerror =
        function() {

            status.textContent =
                "✗ Could not load EmulatorJS.";

        };


    document.body.appendChild(
        script
    );

}


/* ========================================================
   LOAD ROM
   ======================================================== */

document
    .getElementById("load")
    .addEventListener(
        "click",
        function() {

            const rom =
                romSelect.value;


            if (!rom) {

                status.textContent =
                    "Select a ROM first.";

                return;

            }


            startEmulator(
                rom
            );

        }
    );


/* ========================================================
   DOUBLE CLICK
   ======================================================== */

romSelect.addEventListener(
    "dblclick",
    function() {

        const rom =
            romSelect.value;


        if (!rom) {

            return;

        }


        startEmulator(
            rom
        );

    }
);


/* ========================================================
   SYSTEM BUTTONS
   ======================================================== */

document
    .querySelectorAll(
        "[data-system]"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            "[data-system]"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedSystem =
                        button.dataset.system;


                    filterRoms();

                }
            );

        }
    );


/* ========================================================
   DEFAULT SYSTEM
   ======================================================== */

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add(
        "active"
    );


/* ========================================================
   KEYBOARD FIX
   ======================================================== */

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/* ========================================================
   RESET
   ======================================================== */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* ========================================================
   START
   ======================================================== */

scanRoms();

</script>

</body>

</html>
