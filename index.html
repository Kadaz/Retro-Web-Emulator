<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retro Web Emulator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 0 0 20px;
}

.systems {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
}

.systems button {
    padding: 10px 15px;
    border: 1px solid #666;
    border-radius: 6px;
    background: #292929;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.systems button:hover {
    background: #3a3a3a;
}

.systems button.active {
    background: #555;
}

.panel {
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px;
}

#romSelect {
    width: 100%;
    padding: 12px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 15px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
}

.controls button {
    padding: 10px 18px;
    background: #292929;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
}

.controls button:hover {
    background: #3a3a3a;
}

#status {
    padding: 10px 0;
    color: #bbb;
}

#game {
    width: 100%;
    min-height: 500px;
    background: #000;
    position: relative;
}

@media (max-width: 700px) {

    .app {
        padding: 8px;
    }

    #game {
        min-height: 400px;
    }

    .systems button {
        font-size: 13px;
        padding: 8px 11px;
    }
}
</style>

</head>

<body>

<div class="app">

```
<h1>Retro Web Emulator</h1>

<div class="systems">

    <button data-system="snes">
        SNES
    </button>

    <button data-system="nes">
        NES
    </button>

    <button data-system="genesis">
        Mega Drive
    </button>

    <button data-system="sms">
        Master System
    </button>

    <button data-system="gg">
        Game Gear
    </button>

    <button data-system="gb">
        Game Boy
    </button>

    <button data-system="gbc">
        Game Boy Color
    </button>

    <button data-system="gba">
        Game Boy Advance
    </button>

</div>


<div class="panel">

    <select id="romSelect">
        <option value="">
            Loading ROMs...
        </option>
    </select>


    <div class="controls">

        <button id="play">
            Play
        </button>

        <button id="refresh">
            Refresh
        </button>

        <button id="reset">
            Reset
        </button>

    </div>


    <div id="status">
        Loading ROMs...
    </div>


    <div id="game"></div>

</div>
```

</div>

<script>

/*
 * ============================================================
 * EmulatorJS Stable
 * ============================================================
 */

const EJS_DATA =
    "https://cdn.emulatorjs.org/stable/data/";


/*
 * ============================================================
 * ROM location
 * ============================================================
 */

const ROM_PATH =
    "./roms/";


/*
 * ============================================================
 * GitHub ROM API
 * ============================================================
 */

const ROM_API =
    "https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms?ref=main";


/*
 * ============================================================
 * EmulatorJS CORE CONFIGURATION
 *
 * These names come directly from the official Stable
 * EmulatorJS cores.json.
 * ============================================================
 */

const systems = {

    snes: {
        name: "SNES",
        core: "snes9x",
        extensions: [
            ".sfc",
            ".smc",
            ".swc",
            ".fig",
            ".bs",
            ".st"
        ]
    },


    nes: {
        name: "NES",
        core: "nestopia",
        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]
    },


    genesis: {
        name: "Mega Drive / Genesis",
        core: "genesis_plus_gx",
        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]
    },


    sms: {
        name: "Master System",
        core: "genesis_plus_gx",
        extensions: [
            ".sms"
        ]
    },


    gg: {
        name: "Game Gear",
        core: "genesis_plus_gx",
        extensions: [
            ".gg"
        ]
    },


    gb: {
        name: "Game Boy",
        core: "gambatte",
        extensions: [
            ".gb",
            ".dmg"
        ]
    },


    gbc: {
        name: "Game Boy Color",
        core: "gambatte",
        extensions: [
            ".gbc"
        ]
    },


    gba: {
        name: "Game Boy Advance",
        core: "mgba",
        extensions: [
            ".gba"
        ]
    }

};


/*
 * ============================================================
 * CURRENT SYSTEM
 * ============================================================
 */

let currentSystem =
    "snes";


/*
 * ============================================================
 * ELEMENTS
 * ============================================================
 */

const select =
    document.getElementById("romSelect");

const status =
    document.getElementById("status");

const game =
    document.getElementById("game");


/*
 * ============================================================
 * GET CURRENT SYSTEM
 * ============================================================
 */

function getCurrentSystem() {

    return systems[currentSystem];

}


/*
 * ============================================================
 * CHECK ROM EXTENSION
 * ============================================================
 */

function isSupportedROM(filename) {

    const lower =
        filename.toLowerCase();

    return getCurrentSystem()
        .extensions
        .some(extension =>
            lower.endsWith(extension)
        );

}


/*
 * ============================================================
 * LOAD ROM LIST FROM GITHUB
 * ============================================================
 */

async function loadROMs() {

    status.textContent =
        "Loading ROMs...";


    select.innerHTML =
        "<option value=''>Loading...</option>";


    try {

        const response =
            await fetch(
                ROM_API +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "Invalid GitHub ROM response"
            );

        }


        const roms =
            files
            .filter(file => {

                return (
                    file.type === "file" &&
                    isSupportedROM(file.name)
                );

            })
            .sort((a, b) =>
                a.name.localeCompare(
                    b.name
                )
            );


        select.innerHTML = "";


        const firstOption =
            document.createElement(
                "option"
            );

        firstOption.value =
            "";

        firstOption.textContent =
            "Select a game...";

        select.appendChild(
            firstOption
        );


        roms.forEach(file => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                file.name;


            option.textContent =
                file.name;


            select.appendChild(
                option
            );

        });


        status.textContent =
            roms.length +
            " ROM(s) found for " +
            getCurrentSystem().name +
            ".";


    }
    catch(error) {

        console.error(
            "ROM loading error:",
            error
        );


        select.innerHTML =
            "<option value=''>Could not load ROMs</option>";


        status.textContent =
            "Could not load ROM list.";

    }

}


/*
 * ============================================================
 * START EMULATORJS
 * ============================================================
 */

function startGame() {

    const filename =
        select.value;


    if (!filename) {

        status.textContent =
            "Select a game first.";

        return;

    }


    /*
     * --------------------------------------------------------
     * EmulatorJS variables
     * --------------------------------------------------------
     */

    window.EJS_player =
        "#game";


    window.EJS_core =
        getCurrentSystem().core;


    window.EJS_gameUrl =
        ROM_PATH +
        filename
            .split("/")
            .map(part =>
                encodeURIComponent(part)
            )
            .join("/");


    window.EJS_pathtodata =
        EJS_DATA;


    window.EJS_startOnLoaded =
        true;


    /*
     * --------------------------------------------------------
     * Remove previous EmulatorJS loader
     * --------------------------------------------------------
     */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
     * --------------------------------------------------------
     * Clear previous emulator
     * --------------------------------------------------------
     */

    game.innerHTML =
        "";


    status.textContent =
        "Loading " +
        getCurrentSystem().name +
        " core...";


    /*
     * --------------------------------------------------------
     * Load official EmulatorJS Stable loader
     * --------------------------------------------------------
     */

    const loader =
        document.createElement(
            "script"
        );


    loader.id =
        "emulatorjs-loader";


    loader.src =
        EJS_DATA +
        "loader.js";


    loader.onload =
        function() {

            status.textContent =
                "Emulator loaded.";

        };


    loader.onerror =
        function(error) {

            console.error(
                "EmulatorJS loader error:",
                error
            );


            status.textContent =
                "Could not load EmulatorJS.";

        };


    document.body.appendChild(
        loader
    );

}


/*
 * ============================================================
 * SYSTEM BUTTONS
 * ============================================================
 */

document
    .querySelectorAll(
        "[data-system]"
    )
    .forEach(button => {


        button.addEventListener(
            "click",
            function() {


                document
                    .querySelectorAll(
                        "[data-system]"
                    )
                    .forEach(otherButton => {

                        otherButton
                            .classList
                            .remove(
                                "active"
                            );

                    });


                button
                    .classList
                    .add(
                        "active"
                    );


                currentSystem =
                    button.dataset.system;


                loadROMs();

            }

        );

    });


/*
 * ============================================================
 * PLAY BUTTON
 * ============================================================
 */

document
    .getElementById("play")
    .addEventListener(
        "click",
        startGame
    );


/*
 * ============================================================
 * REFRESH BUTTON
 * ============================================================
 */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadROMs
    );


/*
 * ============================================================
 * RESET BUTTON
 * ============================================================
 */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/*
 * ============================================================
 * DEFAULT SYSTEM
 * ============================================================
 */

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList
    .add("active");


/*
 * ============================================================
 * INITIAL ROM LOAD
 * ============================================================
 */

loadROMs();

</script>

</body>
</html>
