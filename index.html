<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Retro Web Emulator</title>

<!-- Retro favicon -->
<link
rel="icon"
type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23191919'/%3E%3Crect x='10' y='18' width='44' height='28' rx='7' fill='%23555'/%3E%3Crect x='17' y='25' width='14' height='4' fill='white'/%3E%3Crect x='22' y='20' width='4' height='14' fill='white'/%3E%3Ccircle cx='44' cy='27' r='3' fill='%23ff5555'/%3E%3Ccircle cx='50' cy='33' r='3' fill='%2355aaff'/%3E%3C/svg%3E"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

#app {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-top: 0;
}

.systems {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
}

.systems button {
    padding: 10px 15px;
    border: 1px solid #666;
    border-radius: 6px;
    background: #292929;
    color: white;
    cursor: pointer;
}

.systems button:hover {
    background: #3a3a3a;
}

.systems button.active {
    background: #555;
}

.panel {
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px;
}

#romSelect,
#pcFile {
    width: 100%;
    padding: 12px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 15px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
}

.controls button {
    padding: 10px 18px;
    background: #292929;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
}

.controls button:hover {
    background: #3a3a3a;
}

#status {
    padding: 10px 0;
    color: #bbb;
}

#game {
    width: 100%;
    min-height: 600px;
    background: #000;
    position: relative;
}

.hidden {
    display: none;
}

.local-info {
    margin-top: 8px;
    color: #888;
    font-size: 13px;
}

@media (max-width: 700px) {

    #app {
        padding: 8px;
    }

    #game {
        min-height: 450px;
    }

}

</style>

</head>

<body>

<div id="app">

<h1>
    Retro Web Emulator
</h1>

<div class="systems">

<button data-system="nes">
    NES
</button>

<button data-system="snes">
    SNES
</button>

<button data-system="genesis">
    Mega Drive
</button>

<button data-system="sms">
    Master System
</button>

<button data-system="gg">
    Game Gear
</button>

<button data-system="gb">
    Game Boy
</button>

<button data-system="gbc">
    Game Boy Color
</button>

<button data-system="gba">
    Game Boy Advance
</button>

<button data-system="atari2600">
    Atari 2600
</button>

<button data-system="n64">
    Nintendo 64
</button>

<button data-system="psx">
    PlayStation 1
</button>

<button data-system="nds">
    Nintendo DS
</button>

<button data-system="psp">
    PSP
</button>

</div>

<div class="panel">

<select id="romSelect">

<option value="">
    Select a game...
</option>

</select>

<input
    type="file"
    id="pcFile"
    class="hidden"
>

<div
    id="localInfo"
    class="local-info hidden"
>
    Select a ROM / ISO file from your PC.
</div>

<div class="controls">

<button id="play">
    Play
</button>

<button id="refresh">
    Refresh
</button>

<button id="reset">
    Reset
</button>

</div>

<div id="status">
    Loading ROM list...
</div>

<div id="game"></div>

</div>

</div>

<script>

/*
============================================================
CONFIGURATION
============================================================
*/

const DATA_PATH =
    "https://cdn.emulatorjs.org/stable/data/";

const ROMS_PATH =
    "./roms/";

/*
GitHub Git Trees API

Unlike /contents/roms, this does not have
the 1,000-files-per-directory limitation.
*/

const GITHUB_TREE_API =
    "https://api.github.com/repos/Kadaz/Retro-Web-Emulator/git/trees/main?recursive=1";

const GITHUB_RAW_PATH =
    "https://raw.githubusercontent.com/Kadaz/Retro-Web-Emulator/main/";


/*
============================================================
SYSTEMS
============================================================
*/

const SYSTEMS = {

    nes: {

        name: "NES",

        core: "nestopia",

        source: "project",

        extensions: [
            "nes",
            "fds",
            "unif",
            "unf"
        ]

    },

    snes: {

        name: "SNES",

        core: "snes9x",

        source: "project",

        extensions: [
            "sfc",
            "smc",
            "swc",
            "fig",
            "bs",
            "st"
        ]

    },

    genesis: {

        name: "Mega Drive / Genesis",

        core: "segaMD",

        source: "project",

        extensions: [
            "md",
            "gen",
            "smd",
            "bin"
        ]

    },

    sms: {

        name: "Master System",

        core: "genesis_plus_gx",

        source: "project",

        extensions: [
            "sms"
        ]

    },

    gg: {

        name: "Game Gear",

        core: "genesis_plus_gx",

        source: "project",

        extensions: [
            "gg"
        ]

    },

    gb: {

        name: "Game Boy",

        core: "gambatte",

        source: "project",

        extensions: [
            "gb",
            "dmg"
        ]

    },

    gbc: {

        name: "Game Boy Color",

        core: "gambatte",

        source: "project",

        extensions: [
            "gbc"
        ]

    },

    gba: {

        name: "Game Boy Advance",

        core: "mgba",

        source: "project",

        extensions: [
            "gba"
        ]

    },

    atari2600: {

        name: "Atari 2600",

        core: "atari2600",

        source: "project",

        extensions: [
            "a26",
            "bin"
        ]

    },

    n64: {

        name: "Nintendo 64",

        core: "n64",

        source: "pc",

        extensions: [
            "z64",
            "n64",
            "v64"
        ]

    },

    psx: {

        name: "PlayStation 1",

        core: "psx",

        source: "pc",

        extensions: [
            "cue",
            "bin",
            "chd",
            "pbp",
            "img",
            "mdf",
            "toc",
            "cbn",
            "m3u",
            "ccd"
        ]

    },

    nds: {

        name: "Nintendo DS",

        core: "nds",

        source: "pc",

        extensions: [
            "nds"
        ]

    },

    psp: {

        name: "PlayStation Portable",

        core: "psp",

        source: "pc",

        extensions: [
            "iso",
            "cso",
            "pbp"
        ],

        threads: true

    }

};


/*
============================================================
CURRENT SYSTEM
============================================================
*/

let currentSystem =
    "snes";

let currentROM =
    null;

let currentLocalFile =
    null;


/*
============================================================
ELEMENTS
============================================================
*/

const romSelect =
    document.getElementById("romSelect");

const pcFile =
    document.getElementById("pcFile");

const localInfo =
    document.getElementById("localInfo");

const status =
    document.getElementById("status");

const game =
    document.getElementById("game");


/*
============================================================
GET SYSTEM
============================================================
*/

function getSystem() {

    return SYSTEMS[currentSystem];

}


/*
============================================================
CHECK EXTENSION
============================================================
*/

function isSupported(filename) {

    const lower =
        filename.toLowerCase();

    const extension =
        lower.includes(".")
            ? lower.split(".").pop()
            : "";

    return getSystem()
        .extensions
        .includes(extension);

}


/*
============================================================
ENCODE GITHUB PATH
============================================================
*/

function encodeGitHubPath(path) {

    return path
        .split("/")
        .map(
            part =>
                encodeURIComponent(part)
        )
        .join("/");

}


/*
============================================================
LOAD ROMS FROM GITHUB GIT TREE
============================================================
*/

async function loadROMs() {

    const system =
        getSystem();


    /*
    --------------------------------------------------------
    Systems using local PC files
    --------------------------------------------------------
    */

    if (system.source === "pc") {

        romSelect.classList.add(
            "hidden"
        );

        pcFile.classList.remove(
            "hidden"
        );

        localInfo.classList.remove(
            "hidden"
        );

        pcFile.value =
            "";

        currentLocalFile =
            null;

        status.textContent =
            system.name +
            " — choose a game from your PC.";

        return;

    }


    /*
    --------------------------------------------------------
    Systems using project ROMs
    --------------------------------------------------------
    */

    romSelect.classList.remove(
        "hidden"
    );

    pcFile.classList.add(
        "hidden"
    );

    localInfo.classList.add(
        "hidden"
    );

    status.textContent =
        "Loading ROMs...";

    romSelect.innerHTML =
        '<option value="">Loading...</option>';


    try {

        /*
        Get the complete repository tree.
        This replaces the old /contents/roms API.
        */

        const response =
            await fetch(
                GITHUB_TREE_API +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "GitHub Tree API error: " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            !Array.isArray(data.tree)
        ) {

            throw new Error(
                "Invalid GitHub Tree response"
            );

        }


        /*
        ----------------------------------------------------
        Find files inside /roms
        ----------------------------------------------------
        */

        const roms =
            data.tree
                .filter(
                    file =>
                        file.type === "blob" &&
                        file.path.startsWith(
                            "roms/"
                        )
                )
                .filter(
                    file =>
                        isSupported(
                            file.path
                        )
                )
                .sort(
                    (a, b) =>
                        a.path.localeCompare(
                            b.path
                        )
                );


        /*
        ----------------------------------------------------
        Build ROM list
        ----------------------------------------------------
        */

        romSelect.innerHTML =
            "";


        const empty =
            document.createElement(
                "option"
            );


        empty.value =
            "";


        empty.textContent =
            "Select a game...";


        romSelect.appendChild(
            empty
        );


        for (
            const rom of roms
        ) {

            const option =
                document.createElement(
                    "option"
                );


            /*
            Store the complete repository
            path instead of only the filename.
            This also allows subfolders inside /roms.
            */

            option.value =
                rom.path;


            option.textContent =
                rom.path.substring(
                    "roms/".length
                );


            romSelect.appendChild(
                option
            );

        }


        status.textContent =
            roms.length +
            " game(s) found for " +
            system.name;


    }
    catch (error) {

        console.error(
            "ROM loading failed:",
            error
        );


        romSelect.innerHTML =
            '<option value="">Unable to load ROMs</option>';


        status.textContent =
            "Unable to load ROM list: " +
            error.message;

    }

}


/*
============================================================
STOP PREVIOUS EMULATOR
============================================================
*/

function stopPreviousEmulator() {

    try {

        if (
            typeof window.EJS_terminate ===
            "function"
        ) {

            window.EJS_terminate();

        }

    }
    catch (error) {

        console.warn(
            "Could not terminate previous emulator:",
            error
        );

    }


    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    game.innerHTML =
        "";

}


/*
============================================================
START GAME
============================================================
*/

function startGame() {

    const system =
        getSystem();


    /*
    --------------------------------------------------------
    Project ROM
    --------------------------------------------------------
    */

    if (
        system.source ===
        "project"
    ) {

        const filepath =
            romSelect.value;


        if (!filepath) {

            status.textContent =
                "Select a game first.";

            return;

        }


        currentROM =
            filepath;


        currentLocalFile =
            null;


        stopPreviousEmulator();


        /*
        Use the actual repository path.

        Example:

        roms/SNES/game.sfc

        becomes:

        ./roms/SNES/game.sfc
        */

        window.EJS_gameUrl =
            GITHUB_RAW_PATH +
            encodeGitHubPath(
                filepath
            );

    }


    /*
    --------------------------------------------------------
    PC ROM / ISO
    --------------------------------------------------------
    */

    else {

        if (!currentLocalFile) {

            status.textContent =
                "Choose a ROM / ISO from your PC first.";

            return;

        }


        currentROM =
            currentLocalFile.name;


        stopPreviousEmulator();


        /*
        EmulatorJS accepts the selected
        File object directly.
        */

        window.EJS_gameUrl =
            currentLocalFile;

    }


    /*
    --------------------------------------------------------
    EmulatorJS configuration
    --------------------------------------------------------
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_pathtodata =
        DATA_PATH;


    window.EJS_startOnLoaded =
        true;


    window.EJS_gameName =
        currentROM;


    /*
    PSP requires threads.
    */

    if (system.threads) {

        window.EJS_threads =
            true;

    }
    else {

        window.EJS_threads =
            false;

    }


    /*
    --------------------------------------------------------
    STATUS
    --------------------------------------------------------
    */

    status.textContent =
        "Loading " +
        system.name +
        " core...";


    /*
    --------------------------------------------------------
    LOAD OFFICIAL STABLE LOADER
    --------------------------------------------------------
    */

    const loader =
        document.createElement(
            "script"
        );


    loader.id =
        "emulatorjs-loader";


    loader.src =
        DATA_PATH +
        "loader.js";


    loader.onload =
        function() {

            status.textContent =
                system.name +
                " emulator loaded.";

        };


    loader.onerror =
        function() {

            status.textContent =
                "ERROR: EmulatorJS loader could not be loaded.";

            console.error(
                "Failed to load:",
                loader.src
            );

        };


    document.body.appendChild(
        loader
    );

}


/*
============================================================
PC FILE SELECTION
============================================================
*/

pcFile.addEventListener(
    "change",
    function() {

        if (!pcFile.files.length) {

            currentLocalFile =
                null;

            status.textContent =
                "No file selected.";

            return;

        }


        const file =
            pcFile.files[0];


        const system =
            getSystem();


        const filename =
            file.name.toLowerCase();


        const extension =
            filename.includes(".")
                ? filename.split(".").pop()
                : "";


        if (
            !system.extensions.includes(
                extension
            )
        ) {

            currentLocalFile =
                null;

            status.textContent =
                "Unsupported file for " +
                system.name +
                ".";

            pcFile.value =
                "";

            return;

        }


        currentLocalFile =
            file;


        status.textContent =
            "Selected: " +
            file.name;

    }
);


/*
============================================================
SYSTEM BUTTONS
============================================================
*/

document
    .querySelectorAll(
        "[data-system]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            "[data-system]"
                        )
                        .forEach(
                            other =>
                                other.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentSystem =
                        button.dataset.system;


                    currentROM =
                        null;


                    currentLocalFile =
                        null;


                    loadROMs();

                }
            );

        }
    );


/*
============================================================
PLAY
============================================================
*/

document
    .getElementById("play")
    .addEventListener(
        "click",
        startGame
    );


/*
============================================================
REFRESH
============================================================
*/

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadROMs
    );


/*
============================================================
RESET
============================================================
*/

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/*
============================================================
DEFAULT SYSTEM
============================================================
*/

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add(
        "active"
    );


/*
============================================================
INITIAL LOAD
============================================================
*/

loadROMs();

</script>

</body>

</html>
