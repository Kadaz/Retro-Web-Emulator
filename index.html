<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retro Web Emulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 0 0 15px;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .tabs button {
            padding: 11px 16px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .tabs button:hover {
            background: #383838;
        }

        .tabs button.active {
            background: #555;
            outline: 2px solid #aaa;
        }

        .panel {
            background: #191919;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
        }

        .rom-section {
            margin-bottom: 12px;
        }

        .rom-select {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 14px;
        }

        .load-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .load-row button {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            background: #292929;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }

        .load-row button:hover {
            background: #383838;
        }

        #status {
            color: #bbb;
            min-height: 24px;
            padding: 8px 0;
        }

        .screen {
            background: #000;
            margin-top: 12px;
            width: 100%;
            position: relative;
            overflow: visible;
        }

        #game {
            width: 100%;
            height: calc(100vh - 300px);
            min-height: 480px;
            position: relative;
        }

        #game canvas {
            max-width: 100%;
        }

        .info {
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .app {
                padding: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 5px;
            }

            .tabs button {
                padding: 9px 10px;
                font-size: 12px;
            }

            #game {
                height: calc(100vh - 310px);
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>Retro Web Emulator</h1>

    <div class="tabs">

        <button data-system="snes">SNES</button>
        <button data-system="nes">NES</button>
        <button data-system="segaMS">Master System</button>
        <button data-system="segaMD">Mega Drive / Genesis</button>
        <button data-system="segaGG">Game Gear</button>
        <button data-system="gb">Game Boy</button>
        <button data-system="gbc">Game Boy Color</button>
        <button data-system="gba">Game Boy Advance</button>

    </div>

    <div class="panel">

        <div class="rom-section">

            <select id="romSelect" class="rom-select">
                <option value="">Loading ROMs...</option>
            </select>

        </div>

        <div class="load-row">

            <button id="load">Play</button>
            <button id="refreshRoms">Refresh ROMs</button>
            <button id="reset">Reset</button>

        </div>

        <div id="status">
            Loading ROM list...
        </div>

        <div class="screen">
            <div id="game"></div>
        </div>

        <p class="info">
            ROMs are loaded automatically from the
            <strong>roms</strong> folder.
        </p>

    </div>

</div>


<script>

/* =========================================================
   SETTINGS
   ========================================================= */

const DATA_PATH = "./data/";

const ROM_PATH = "./roms/";

const GITHUB_API =
    "https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms?ref=main";


/* =========================================================
   STATE
   ========================================================= */

let selectedSystem = "snes";

let romFiles = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const status =
    document.getElementById("status");

const romSelect =
    document.getElementById("romSelect");

const gameContainer =
    document.getElementById("game");


/* =========================================================
   SYSTEMS
   ========================================================= */

const systems = {

    snes: {
        name: "Super Nintendo / SNES",
        core: "snes9x",
        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".gd3",
            ".gd7",
            ".dx2",
            ".bsx",
            ".swc"
        ]
    },

    nes: {
        name: "Nintendo Entertainment System / NES",
        core: "nestopia",
        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]
    },

    segaMS: {
        name: "Sega Master System",
        core: "genesis_plus_gx",
        extensions: [
            ".sms"
        ]
    },

    segaMD: {
        name: "Sega Mega Drive / Genesis",
        core: "genesis_plus_gx",
        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]
    },

    segaGG: {
        name: "Sega Game Gear",
        core: "genesis_plus_gx",
        extensions: [
            ".gg"
        ]
    },

    gb: {
        name: "Nintendo Game Boy",
        core: "gambatte",
        extensions: [
            ".gb"
        ]
    },

    gbc: {
        name: "Nintendo Game Boy Color",
        core: "gambatte",
        extensions: [
            ".gbc"
        ]
    },

    gba: {
        name: "Nintendo Game Boy Advance",
        core: "mgba",
        extensions: [
            ".gba"
        ]
    }

};


/* =========================================================
   CURRENT SYSTEM
   ========================================================= */

function getCurrentSystem() {
    return systems[selectedSystem];
}


/* =========================================================
   ROM EXTENSION
   ========================================================= */

function isSupportedRom(filename) {

    const lower =
        filename.toLowerCase();

    return getCurrentSystem()
        .extensions
        .some(function(ext) {
            return lower.endsWith(ext);
        });

}


/* =========================================================
   LOAD ROM LIST
   ========================================================= */

async function loadRomList() {

    status.textContent =
        "Loading ROMs...";

    romSelect.innerHTML =
        '<option value="">Loading ROMs...</option>';

    try {

        const response =
            await fetch(
                GITHUB_API,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }

        const files =
            await response.json();

        romFiles =
            files.filter(function(file) {

                return (
                    file.type === "file" &&
                    isSupportedRom(file.name)
                );

            });

        populateRomList();

    }
    catch (error) {

        console.error(error);

        romSelect.innerHTML =
            '<option value="">Could not load ROM list</option>';

        status.textContent =
            "Could not load ROM list.";

    }

}


/* =========================================================
   POPULATE ROM LIST
   ========================================================= */

function populateRomList() {

    romSelect.innerHTML = "";

    if (romFiles.length === 0) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "No ROMs found for " +
            getCurrentSystem().name;

        romSelect.appendChild(option);

        status.textContent =
            "No ROMs found for " +
            getCurrentSystem().name +
            ".";

        return;

    }


    const first =
        document.createElement("option");

    first.value = "";

    first.textContent =
        "Select a game...";

    romSelect.appendChild(first);


    romFiles
        .sort(function(a, b) {
            return a.name.localeCompare(b.name);
        })
        .forEach(function(file) {

            const option =
                document.createElement("option");

            option.value =
                file.name;

            option.textContent =
                file.name;

            romSelect.appendChild(option);

        });


    status.textContent =
        romFiles.length +
        " ROM(s) found for " +
        getCurrentSystem().name +
        ".";

}


/* =========================================================
   ROM URL
   ========================================================= */

function getSelectedRomUrl() {

    const filename =
        romSelect.value;

    if (!filename) {
        return "";
    }

    return (
        ROM_PATH +
        filename
            .split("/")
            .map(encodeURIComponent)
            .join("/")
    );

}


/* =========================================================
   SYSTEM BUTTONS
   ========================================================= */

document
    .querySelectorAll("[data-system]")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(
                        "[data-system]"
                    )
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                selectedSystem =
                    button.dataset.system;


                /*
                 * IMPORTANT:
                 * Reload the ROM list so only
                 * ROMs belonging to the selected
                 * console are displayed.
                 */

                loadRomList();

            }
        );

    });


/* =========================================================
   DEFAULT SYSTEM
   ========================================================= */

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add("active");


/* =========================================================
   LOAD EMULATORJS
   ========================================================= */

function loadEmulator(romUrl) {

    const system =
        getCurrentSystem();


    status.textContent =
        "Starting " +
        system.name +
        "...";


    /*
     * EmulatorJS configuration.
     *
     * Everything is LOCAL.
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        system.core;

    window.EJS_gameUrl =
        romUrl;

    window.EJS_mouse =
        false;

    window.EJS_multitap =
        false;

    /*
     * This is the critical setting.
     *
     * EmulatorJS looks inside this
     * directory for its loader,
     * emulator files and cores.
     */

    window.EJS_pathtodata =
        DATA_PATH;


    /*
     * Start automatically.
     */

    window.EJS_startOnLoaded =
        true;


    /*
     * Remove previous emulator.
     */

    gameContainer.innerHTML = "";


    const old =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (old) {
        old.remove();
    }


    /*
     * Load the LOCAL loader.
     */

    const loader =
        document.createElement("script");

    loader.id =
        "emulatorjs-loader";

    loader.src =
        DATA_PATH +
        "loader.js";


    loader.onload =
        function() {

            status.textContent =
                system.name +
                " emulator loaded.";

        };


    loader.onerror =
        function() {

            status.textContent =
                "ERROR: Could not load local EmulatorJS.";

            console.error(
                "EmulatorJS loader failed:",
                loader.src
            );

        };


    document.body.appendChild(loader);

}


/* =========================================================
   PLAY
   ========================================================= */

document
    .getElementById("load")
    .addEventListener(
        "click",
        function() {

            const romUrl =
                getSelectedRomUrl();


            if (!romUrl) {

                status.textContent =
                    "Select a game first.";

                return;

            }


            loadEmulator(
                romUrl
            );

        }
    );


/* =========================================================
   REFRESH
   ========================================================= */

document
    .getElementById("refreshRoms")
    .addEventListener(
        "click",
        function() {

            loadRomList();

        }
    );


/* =========================================================
   RESET
   ========================================================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* =========================================================
   KEYBOARD
   ========================================================= */

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            document.activeElement ===
            romSelect
        ) {
            return;
        }

        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            document.activeElement ===
            romSelect
        ) {
            return;
        }

        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


/* =========================================================
   INITIAL ROM SCAN
   ========================================================= */

loadRomList();

</script>

</body>
</html>
