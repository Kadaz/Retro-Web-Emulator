<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retro Web Emulator</title>

    <link
        rel="stylesheet"
        href="data/emulator.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
        }

        .app {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 0 0 15px 0;
            text-align: center;
        }


        /* ==================================================
           SYSTEM BUTTONS
           ================================================== */

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .tabs button {
            padding: 11px 16px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .tabs button:hover {
            background: #383838;
        }

        .tabs button.active {
            background: #555;
            outline: 2px solid #aaa;
        }


        /* ==================================================
           PANEL
           ================================================== */

        .panel {
            background: #191919;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
        }


        /* ==================================================
           ROM LIST
           ================================================== */

        #romList {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            max-height: 260px;
            overflow-y: auto;
        }

        .romButton {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #252525;
            color: #eee;
            cursor: pointer;
        }

        .romButton:hover {
            background: #3a3a3a;
        }


        /* ==================================================
           STATUS
           ================================================== */

        #status {
            color: #bbb;
            min-height: 24px;
            padding: 8px 0;
        }


        /* ==================================================
           EMULATOR
           ================================================== */

        .screen {
            background: #000;
            margin-top: 12px;
            width: 100%;
            position: relative;
            overflow: visible;
        }

        #game {
            width: 100%;
            height: calc(100vh - 250px);
            min-height: 480px;
            position: relative;
        }


        /* ==================================================
           INFO
           ================================================== */

        .info {
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 700px) {

            .app {
                padding: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 5px;
            }

            .tabs button {
                padding: 9px 10px;
                font-size: 12px;
            }

            #game {
                height: calc(100vh - 260px);
                min-height: 400px;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <h1>
        Retro Web Emulator
    </h1>


    <!-- ==================================================
         SYSTEM SELECTION
         ================================================== -->

    <div class="tabs">

        <button data-system="snes">
            SNES
        </button>

        <button data-system="nes">
            NES
        </button>

        <button data-system="segaMS">
            Master System
        </button>

        <button data-system="segaMD">
            Mega Drive / Genesis
        </button>

        <button data-system="segaGG">
            Game Gear
        </button>

        <button data-system="gb">
            Game Boy
        </button>

        <button data-system="gbc">
            Game Boy Color
        </button>

        <button data-system="gba">
            Game Boy Advance
        </button>

    </div>


    <!-- ==================================================
         MAIN PANEL
         ================================================== -->

    <div class="panel">

        <div id="status">
            Scanning ROMs...
        </div>


        <!-- ==================================================
             ROM LIST
             ================================================== -->

        <div id="romList"></div>


        <!-- ==================================================
             EMULATOR
             ================================================== -->

        <div class="screen">

            <div id="game"></div>

        </div>


        <p class="info">

            Select a system above, then select a ROM.
            Keyboard, gamepad and save support are handled
            by EmulatorJS.

        </p>

    </div>

</div>


<script>

/*
============================================================
RETRO WEB EMULATOR
============================================================
*/


let selectedSystem = "snes";

let emulatorStarted = false;


/*
============================================================
ELEMENTS
============================================================
*/

const status =
    document.getElementById("status");

const romList =
    document.getElementById("romList");

const gameContainer =
    document.getElementById("game");


/*
============================================================
SYSTEM CONFIGURATION
============================================================
*/

const systems = {

    snes: {

        name: "Super Nintendo / SNES",

        core: "snes",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".gd3",
            ".gd7",
            ".dx2",
            ".bsx",
            ".swc"
        ]

    },


    nes: {

        name: "Nintendo Entertainment System / NES",

        core: "nes",

        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]

    },


    segaMS: {

        name: "Sega Master System",

        core: "segaMS",

        extensions: [
            ".sms"
        ]

    },


    segaMD: {

        name: "Sega Mega Drive / Genesis",

        core: "segaMD",

        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]

    },


    segaGG: {

        name: "Sega Game Gear",

        core: "segaGG",

        extensions: [
            ".gg"
        ]

    },


    gb: {

        name: "Nintendo Game Boy",

        core: "gb",

        extensions: [
            ".gb"
        ]

    },


    gbc: {

        name: "Nintendo Game Boy Color",

        core: "gbc",

        extensions: [
            ".gbc"
        ]

    },


    gba: {

        name: "Nintendo Game Boy Advance",

        core: "gba",

        extensions: [
            ".gba"
        ]

    }

};


/*
============================================================
CHECK EXTENSION
============================================================
*/

function matchesSystem(filename, systemName) {

    const lower =
        filename.toLowerCase();

    return systems[systemName]
        .extensions
        .some(function(extension) {

            return lower.endsWith(extension);

        });

}


/*
============================================================
GITHUB ROM SCAN
============================================================

GitHub Pages cannot directly list a folder.

Therefore we use the GitHub API to read:

/roms/

============================================================
*/

async function scanRoms() {

    status.textContent =
        "Scanning ROMs folder...";

    romList.innerHTML = "";


    const apiUrl =
        "https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms";


    try {

        const response =
            await fetch(
                apiUrl,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "Invalid GitHub API response."
            );

        }


        /*
        Only files are accepted.
        */

        const roms =
            files.filter(function(file) {

                return file.type === "file";

            });


        if (roms.length === 0) {

            status.textContent =
                "No ROMs found in roms folder.";

            return;

        }


        status.textContent =
            roms.length +
            " ROM(s) found. Select a system.";


        /*
        Display ROMs for current system.
        */

        showSystemRoms();


    }
    catch (error) {

        status.innerHTML =
            "✗ Could not scan roms folder.<br><br>" +
            "<small>" +
            error.message +
            "</small>";

        console.error(error);

    }

}


/*
============================================================
ROM CACHE
============================================================
*/

let availableRoms = [];


/*
============================================================
SCAN ROMS AND STORE
============================================================
*/

async function loadRomDatabase() {

    status.textContent =
        "Scanning ROMs folder...";


    const apiUrl =
        "https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms";


    try {

        const response =
            await fetch(
                apiUrl,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        availableRoms =
            files.filter(function(file) {

                return file.type === "file";

            });


        showSystemRoms();


    }
    catch (error) {

        status.innerHTML =
            "✗ Could not scan roms folder.<br><br>" +
            "<small>" +
            error.message +
            "</small>";

        console.error(error);

    }

}


/*
============================================================
SHOW ROMS FOR SELECTED SYSTEM
============================================================
*/

function showSystemRoms() {

    romList.innerHTML = "";


    const system =
        systems[selectedSystem];


    const matching =
        availableRoms.filter(function(file) {

            return matchesSystem(
                file.name,
                selectedSystem
            );

        });


    if (matching.length === 0) {

        status.textContent =
            "No " +
            system.name +
            " ROMs found.";

        return;

    }


    status.textContent =
        system.name +
        " — " +
        matching.length +
        " ROM(s)";


    matching.forEach(function(file) {

        const button =
            document.createElement("button");


        button.className =
            "romButton";


        button.textContent =
            file.name;


        button.addEventListener(
            "click",
            function() {

                startRom(
                    file.download_url,
                    file.name
                );

            }
        );


        romList.appendChild(button);

    });

}


/*
============================================================
SYSTEM BUTTONS
============================================================
*/

document
    .querySelectorAll("[data-system]")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll("[data-system]")
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                selectedSystem =
                    button.dataset.system;


                showSystemRoms();

            }
        );

    });


/*
============================================================
DEFAULT SYSTEM
============================================================
*/

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add("active");


/*
============================================================
START EMULATOR
============================================================
*/

function startRom(
    romUrl,
    romName
) {

    const system =
        systems[selectedSystem];


    status.textContent =
        "Starting " +
        romName +
        "...";


    /*
    ========================================================
    EmulatorJS configuration
    ========================================================
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        romUrl;


    window.EJS_gameName =
        romName;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    /*
    ========================================================
    LOCAL EMULATORJS DATA
    ========================================================
    */

    window.EJS_pathtodata =
        "./data/";


    /*
    ========================================================
    IMPORTANT
    ========================================================

    We have genesis_plus_gx-legacy-wasm.data locally,
    so force EmulatorJS to use legacy cores.

    ========================================================
    */

    window.EJS_forceLegacyCores =
        true;


    /*
    ========================================================
    Remove previous emulator
    ========================================================
    */

    gameContainer.innerHTML = "";


    /*
    Remove previous loader
    */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
    ========================================================
    LOAD LOCAL EMULATORJS LOADER
    ========================================================
    */

    const script =
        document.createElement("script");


    script.id =
        "emulatorjs-loader";


    script.src =
        "./data/loader.js";


    script.onload =
        function() {

            emulatorStarted =
                true;


            status.textContent =
                romName +
                " loaded.";

        };


    script.onerror =
        function() {

            status.textContent =
                "✗ Could not load local EmulatorJS.";

        };


    document.body.appendChild(
        script
    );

}


/*
============================================================
KEYBOARD FIX
============================================================
*/

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


document.addEventListener(
    "keyup",
    function(event) {

        if (
            emulatorKeys.has(event.key)
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
START ROM DATABASE
============================================================
*/

loadRomDatabase();


</script>


</body>

</html>
