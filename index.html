<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Web Emulator</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    min-height: 600px;
    background: #000;
}

#status {
    padding: 15px;
    text-align: center;
}
</style>

</head>

<body>

<div id="status">
    Loading Game Boy Color emulator...
</div>

<div id="game"></div>

<script>
EJS_player = "#game";
EJS_core = "gbc";
EJS_gameUrl = "./roms/super-metroid.gbc";
EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
