<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Web Emulator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
}

.app {
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

h1 {
    text-align: center;
    margin: 0 0 18px;
}

.systems {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
}

.systems button {
    background: #292929;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
}

.systems button:hover,
.systems button.active {
    background: #444;
}

.panel {
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px;
}

select {
    width: 100%;
    padding: 11px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.controls button {
    padding: 10px 18px;
    background: #292929;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
}

.controls button:hover {
    background: #444;
}

#status {
    min-height: 25px;
    padding: 10px 0;
    color: #bbb;
}

#game {
    width: 100%;
    min-height: 500px;
    background: #000;
}

.info {
    color: #888;
    font-size: 13px;
}

@media(max-width:700px) {
    .app {
        padding: 8px;
    }

    .systems button {
        font-size: 12px;
        padding: 8px 10px;
    }

    #game {
        min-height: 400px;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>Retro Web Emulator</h1>

<div class="systems">

<button data-system="snes">SNES</button>
<button data-system="nes">NES</button>
<button data-system="genesis">Mega Drive</button>
<button data-system="sms">Master System</button>
<button data-system="gg">Game Gear</button>
<button data-system="gb">Game Boy</button>
<button data-system="gbc">Game Boy Color</button>
<button data-system="gba">Game Boy Advance</button>

</div>

<div class="panel">

<select id="romSelect">
<option value="">Loading ROMs...</option>
</select>

<div class="controls">
<button id="play">Play</button>
<button id="refresh">Refresh</button>
<button id="reset">Reset</button>
</div>

<div id="status">
Loading ROM list...
</div>

<div id="game"></div>

<p class="info">
ROMs are loaded automatically from the roms folder.
</p>

</div>
</div>

<script>

const DATA_PATH = "./data/";

const ROM_PATH = "./roms/";

const API_URL =
"https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms?ref=main";


const systems = {

    snes: {
        name: "SNES",
        core: "snes9x",
        extensions: [".sfc", ".smc"]
    },

    nes: {
        name: "NES",
        core: "nestopia",
        extensions: [".nes", ".fds"]
    },

    genesis: {
        name: "Mega Drive / Genesis",
        core: "genesis_plus_gx",
        extensions: [".md", ".gen", ".smd", ".bin"]
    },

    sms: {
        name: "Master System",
        core: "genesis_plus_gx",
        extensions: [".sms"]
    },

    gg: {
        name: "Game Gear",
        core: "genesis_plus_gx",
        extensions: [".gg"]
    },

    gb: {
        name: "Game Boy",
        core: "gambatte",
        extensions: [".gb"]
    },

    gbc: {
        name: "Game Boy Color",
        core: "gambatte",
        extensions: [".gbc"]
    },

    gba: {
        name: "Game Boy Advance",
        core: "mgba",
        extensions: [".gba"]
    }

};


let currentSystem = "snes";


const romSelect =
document.getElementById("romSelect");

const status =
document.getElementById("status");

const game =
document.getElementById("game");


function getSystem() {
    return systems[currentSystem];
}


function supportedFile(name) {

    const lower =
    name.toLowerCase();

    return getSystem().extensions.some(
        ext => lower.endsWith(ext)
    );

}


async function loadROMList() {

    status.textContent =
    "Loading ROMs...";

    romSelect.innerHTML =
    "<option value=''>Loading ROMs...</option>";

    try {

        const response =
        await fetch(API_URL + "&t=" + Date.now());

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const files =
        await response.json();

        const roms =
        files
        .filter(file =>
            file.type === "file" &&
            supportedFile(file.name)
        )
        .sort((a,b) =>
            a.name.localeCompare(b.name)
        );


        romSelect.innerHTML = "";


        if (!roms.length) {

            romSelect.innerHTML =
            "<option value=''>No ROMs found</option>";

            status.textContent =
            "No ROMs found for " +
            getSystem().name;

            return;
        }


        const empty =
        document.createElement("option");

        empty.value = "";

        empty.textContent =
        "Select a game...";

        romSelect.appendChild(empty);


        roms.forEach(file => {

            const option =
            document.createElement("option");

            option.value =
            file.name;

            option.textContent =
            file.name;

            romSelect.appendChild(option);

        });


        status.textContent =
        roms.length +
        " ROM(s) found for " +
        getSystem().name + ".";

    }
    catch(error) {

        console.error(error);

        status.textContent =
        "Could not load ROM list.";

        romSelect.innerHTML =
        "<option value=''>Error loading ROMs</option>";
    }

}


function startEmulator() {

    const filename =
    romSelect.value;

    if (!filename) {

        status.textContent =
        "Select a game first.";

        return;
    }


    const romURL =
    ROM_PATH +
    filename
    .split("/")
    .map(encodeURIComponent)
    .join("/");


    const oldLoader =
    document.getElementById(
        "emulatorjs-loader"
    );

    if (oldLoader) {
        oldLoader.remove();
    }


    game.innerHTML = "";


    /*
     * EmulatorJS configuration
     */

    window.EJS_player =
    "#game";

    window.EJS_gameUrl =
    romURL;

    window.EJS_core =
    getSystem().core;

    /*
     * IMPORTANT:
     * EmulatorJS data is in ./data/
     * and the cores are in ./data/cores/
     */

    window.EJS_pathtodata =
    "./data/";

    window.EJS_startOnLoaded =
    true;


    status.textContent =
    "Loading " +
    getSystem().name +
    "...";


    const script =
    document.createElement("script");

    script.id =
    "emulatorjs-loader";

    script.src =
    "./data/loader.js";


    script.onerror =
    function() {

        status.textContent =
        "ERROR: EmulatorJS loader could not be loaded.";

    };


    document.body.appendChild(script);

}


document
.querySelectorAll("[data-system]")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(
            "[data-system]"
        )
        .forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");

        currentSystem =
        button.dataset.system;

        loadROMList();

    });

});


document
.getElementById("play")
.addEventListener(
    "click",
    startEmulator
);


document
.getElementById("refresh")
.addEventListener(
    "click",
    loadROMList
);


document
.getElementById("reset")
.addEventListener(
    "click",
    () => location.reload()
);


document
.querySelector(
    '[data-system="snes"]'
)
.classList.add("active");


loadROMList();

</script>

</body>
</html>
