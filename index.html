<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retro Web Emulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 0 0 15px 0;
            text-align: center;
        }

        /* ==================================================
           SYSTEM BUTTONS
           ================================================== */

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .tabs button {
            padding: 11px 16px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .tabs button:hover {
            background: #383838;
        }

        .tabs button.active {
            background: #555;
            outline: 2px solid #aaa;
        }

        /* ==================================================
           PANEL
           ================================================== */

        .panel {
            background: #191919;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
        }

        /* ==================================================
           ROM LIST
           ================================================== */

        .rom-section {
            margin-bottom: 12px;
        }

        .rom-select {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 14px;
        }

        .load-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .load-row button {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            background: #292929;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }

        .load-row button:hover {
            background: #383838;
        }

        /* ==================================================
           STATUS
           ================================================== */

        #status {
            color: #bbb;
            min-height: 24px;
            padding: 8px 0;
        }

        /* ==================================================
           EMULATOR
           ================================================== */

        .screen {
            background: #000;
            margin-top: 12px;
            width: 100%;
            position: relative;
            overflow: visible;
        }

        #game {
            width: 100%;
            height: calc(100vh - 300px);
            min-height: 480px;
            position: relative;
        }

        /*
         * Leave enough vertical space for EmulatorJS controls,
         * including volume and the lower-right buttons.
         */

        #game canvas {
            max-width: 100%;
        }

        /* ==================================================
           INFORMATION
           ================================================== */

        .info {
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }

        /* ==================================================
           SMALL SCREENS
           ================================================== */

        @media (max-width: 700px) {

            .app {
                padding: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 5px;
            }

            .tabs button {
                padding: 9px 10px;
                font-size: 12px;
            }

            #game {
                height: calc(100vh - 310px);
                min-height: 400px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <h1>
        Retro Web Emulator
    </h1>


    <!-- ==================================================
         SYSTEM SELECTION
         ================================================== -->

    <div class="tabs">

        <button data-system="snes">
            SNES
        </button>

        <button data-system="nes">
            NES
        </button>

        <button data-system="segaMS">
            Master System
        </button>

        <button data-system="segaMD">
            Mega Drive / Genesis
        </button>

        <button data-system="segaGG">
            Game Gear
        </button>

        <button data-system="gb">
            Game Boy
        </button>

        <button data-system="gbc">
            Game Boy Color
        </button>

        <button data-system="gba">
            Game Boy Advance
        </button>

    </div>


    <!-- ==================================================
         MAIN PANEL
         ================================================== -->

    <div class="panel">


        <!-- ==================================================
             AUTOMATIC ROM LIST
             ================================================== -->

        <div class="rom-section">

            <select
                id="romSelect"
                class="rom-select"
            >

                <option value="">
                    Loading ROMs...
                </option>

            </select>

        </div>


        <div class="load-row">

            <button id="load">
                Play
            </button>

            <button id="refreshRoms">
                Refresh ROMs
            </button>

            <button id="reset">
                Reset
            </button>

        </div>


        <!-- STATUS -->

        <div id="status">
            Loading ROM list...
        </div>


        <!-- ==================================================
             EMULATOR
             ================================================== -->

        <div class="screen">

            <div id="game"></div>

        </div>


        <p class="info">

            ROMs are loaded automatically from the
            <strong>roms</strong> folder.
            Keyboard and compatible gamepads are handled by
            EmulatorJS.

        </p>


    </div>


</div>


<script>


/*
============================================================
RETRO WEB EMULATOR
============================================================
*/


let selectedSystem = "snes";

let emulatorStarted = false;

let romFiles = [];


/*
============================================================
ELEMENTS
============================================================
*/

const status =
    document.getElementById("status");

const romSelect =
    document.getElementById("romSelect");

const gameContainer =
    document.getElementById("game");


/*
============================================================
GITHUB REPOSITORY
============================================================
*/

const GITHUB_OWNER =
    "Kadaz";

const GITHUB_REPOSITORY =
    "Retro-Web-Emulator";

const GITHUB_BRANCH =
    "main";


/*
============================================================
SYSTEM INFORMATION
============================================================
*/

const systems = {

    snes: {

        name: "Super Nintendo / SNES",

        core: "snes9x",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".gd3",
            ".gd7",
            ".dx2",
            ".bsx",
            ".swc"
        ]

    },


    nes: {

        name: "Nintendo Entertainment System / NES",

        core: "nestopia",

        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]

    },


    segaMS: {

        name: "Sega Master System",

        core: "genesis_plus_gx",

        extensions: [
            ".sms"
        ]

    },


    segaMD: {

        name: "Sega Mega Drive / Genesis",

        core: "genesis_plus_gx",

        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]

    },


    segaGG: {

        name: "Sega Game Gear",

        core: "genesis_plus_gx",

        extensions: [
            ".gg"
        ]

    },


    gb: {

        name: "Nintendo Game Boy",

        core: "gambatte",

        extensions: [
            ".gb"
        ]

    },


    gbc: {

        name: "Nintendo Game Boy Color",

        core: "gambatte",

        extensions: [
            ".gbc"
        ]

    },


    gba: {

        name: "Nintendo Game Boy Advance",

        core: "mgba",

        extensions: [
            ".gba"
        ]

    }

};


/*
============================================================
GET CURRENT SYSTEM
============================================================
*/

function getCurrentSystem() {

    return systems[selectedSystem];

}


/*
============================================================
CHECK FILE EXTENSION
============================================================
*/

function isSupportedRom(filename) {

    const system =
        getCurrentSystem();

    const lower =
        filename.toLowerCase();

    return system.extensions.some(
        function(extension) {

            return lower.endsWith(extension);

        }
    );

}


/*
============================================================
LOAD ROM LIST FROM GITHUB
============================================================
*/

async function loadRomList() {

    status.textContent =
        "Loading ROMs...";

    romSelect.innerHTML =
        "<option value=\"\">Loading ROMs...</option>";


    const apiUrl =
        "https://api.github.com/repos/" +
        GITHUB_OWNER +
        "/" +
        GITHUB_REPOSITORY +
        "/contents/roms?ref=" +
        GITHUB_BRANCH;


    try {

        const response =
            await fetch(
                apiUrl,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub API HTTP " +
                response.status
            );

        }


        const files =
            await response.json();


        romFiles =
            files.filter(
                function(file) {

                    return (
                        file.type === "file" &&
                        isSupportedRom(file.name)
                    );

                }
            );


        populateRomList();


    }
    catch (error) {

        console.error(
            "ROM scan error:",
            error
        );


        romSelect.innerHTML =
            "<option value=\"\">" +
            "Could not load ROM list" +
            "</option>";


        status.textContent =
            "Could not load ROM list.";

    }

}


/*
============================================================
POPULATE ROM LIST
============================================================
*/

function populateRomList() {

    romSelect.innerHTML = "";


    if (romFiles.length === 0) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "No ROMs found for " +
            getCurrentSystem().name;

        romSelect.appendChild(
            option
        );


        status.textContent =
            "No ROMs found for " +
            getCurrentSystem().name +
            ".";

        return;

    }


    const firstOption =
        document.createElement("option");

    firstOption.value = "";

    firstOption.textContent =
        "Select a game...";

    romSelect.appendChild(
        firstOption
    );


    romFiles
        .sort(
            function(a, b) {

                return a.name.localeCompare(
                    b.name
                );

            }
        )
        .forEach(
            function(file) {

                const option =
                    document.createElement("option");

                option.value =
                    file.name;

                option.textContent =
                    file.name;

                romSelect.appendChild(
                    option
                );

            }
        );


    status.textContent =
        romFiles.length +
        " ROM(s) found for " +
        getCurrentSystem().name +
        ".";

}


/*
============================================================
GET ROM URL
============================================================
*/

function getSelectedRomUrl() {

    const filename =
        romSelect.value;


    if (!filename) {

        return "";

    }


    return (
        "./roms/" +
        encodeURIComponent(filename)
    );

}


/*
============================================================
SYSTEM BUTTONS
============================================================
*/

document
    .querySelectorAll("[data-system]")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                async function() {

                    document
                        .querySelectorAll(
                            "[data-system]"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedSystem =
                        button.dataset.system;


                    const system =
                        getCurrentSystem();


                    status.textContent =
                        "Loading " +
                        system.name +
                        " ROMs...";


                    /*
                    Reload the list because the
                    extensions change with system.
                    */

                    populateRomList();

                }
            );

        }
    );


/*
============================================================
DEFAULT SYSTEM
============================================================
*/

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add("active");


/*
============================================================
START EMULATORJS
============================================================
*/

function loadEmulator(
    romUrlValue
) {

    const system =
        getCurrentSystem();


    status.textContent =
        "Starting " +
        system.name +
        " emulator...";


    /*
    ========================================================
    EmulatorJS configuration
    ========================================================
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        romUrlValue;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    /*
    ========================================================
    LOCAL DATA
    ========================================================
    */

    window.EJS_pathtodata =
        "./data/";


    /*
    ========================================================
    REMOVE OLD EMULATOR
    ========================================================
    */

    gameContainer.innerHTML =
        "";


    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
    ========================================================
    LOAD LOCAL EMULATORJS
    ========================================================
    */

    const script =
        document.createElement("script");


    script.id =
        "emulatorjs-loader";


    script.src =
        "./data/loader.js";


    script.onload =
        function() {

            emulatorStarted =
                true;


            status.textContent =
                system.name +
                " emulator started.";

        };


    script.onerror =
        function() {

            status.textContent =
                "Could not load EmulatorJS loader.";

        };


    document.body.appendChild(
        script
    );

}


/*
============================================================
PLAY BUTTON
============================================================
*/

document
    .getElementById("load")
    .addEventListener(
        "click",
        function() {

            const romUrl =
                getSelectedRomUrl();


            if (!romUrl) {

                status.textContent =
                    "Select a game first.";

                return;

            }


            loadEmulator(
                romUrl
            );

        }
    );


/*
============================================================
REFRESH ROMS
============================================================
*/

document
    .getElementById("refreshRoms")
    .addEventListener(
        "click",
        function() {

            loadRomList();

        }
    );


/*
============================================================
RESET
============================================================
*/

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/*
============================================================
KEYBOARD FIX
============================================================
*/

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


/*
============================================================
KEY DOWN
============================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        /*
        Do not interfere with select controls.
        */

        if (
            document.activeElement ===
            romSelect
        ) {

            return;

        }


        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
KEY UP
============================================================
*/

document.addEventListener(
    "keyup",
    function(event) {

        if (
            document.activeElement ===
            romSelect
        ) {

            return;

        }


        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
INITIAL ROM SCAN
============================================================
*/

loadRomList();


</script>

</body>

</html>
