<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Web Emulator</title>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
}

.app {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.systems {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
}

.systems button,
.controls button {
    padding: 10px 14px;
    background: #292929;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
}

.systems button.active {
    background: #555;
}

.panel {
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 15px;
}

#romSelect {
    width: 100%;
    padding: 12px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
}

.controls {
    display: flex;
    gap: 8px;
    margin: 10px 0;
}

#status {
    padding: 10px 0;
    color: #bbb;
}

#game {
    width: 100%;
    min-height: 500px;
    background: #000;
}
</style>
</head>

<body>

<div class="app">

<h1>Retro Web Emulator</h1>

<div class="systems">
<button data-system="snes">SNES</button>
<button data-system="nes">NES</button>
<button data-system="genesis">Mega Drive</button>
<button data-system="sms">Master System</button>
<button data-system="gg">Game Gear</button>
<button data-system="gb">Game Boy</button>
<button data-system="gbc">Game Boy Color</button>
<button data-system="gba">Game Boy Advance</button>
</div>

<div class="panel">

<select id="romSelect">
<option value="">Loading ROMs...</option>
</select>

<div class="controls">
<button id="play">Play</button>
<button id="refresh">Refresh</button>
<button id="reset">Reset</button>
</div>

<div id="status">Loading ROMs...</div>

<div id="game"></div>

</div>
</div>

<script>

const ROM_PATH = "./roms/";

const EJS_DATA =
"https://cdn.emulatorjs.org/stable/data/";

const ROM_API =
"https://api.github.com/repos/Kadaz/Retro-Web-Emulator/contents/roms?ref=main";


/*
    IMPORTANT:
    These are EmulatorJS core identifiers,
    NOT the filenames of the .data files.
*/

const systems = {

    snes: {
        core: "snes",
        extensions: [".sfc", ".smc"]
    },

    nes: {
        core: "nes",
        extensions: [".nes", ".fds"]
    },

    genesis: {
        core: "segaMD",
        extensions: [".md", ".gen", ".smd", ".bin"]
    },

    sms: {
        core: "segaMS",
        extensions: [".sms"]
    },

    gg: {
        core: "segaGG",
        extensions: [".gg"]
    },

    gb: {
        core: "gb",
        extensions: [".gb"]
    },

    gbc: {
        core: "gbc",
        extensions: [".gbc"]
    },

    gba: {
        core: "gba",
        extensions: [".gba"]
    }

};


let currentSystem = "snes";


const select =
document.getElementById("romSelect");

const status =
document.getElementById("status");


function getSystem() {
    return systems[currentSystem];
}


function supported(name) {

    const lower =
        name.toLowerCase();

    return getSystem().extensions.some(
        ext => lower.endsWith(ext)
    );

}


async function loadROMs() {

    status.textContent =
        "Loading ROMs...";

    try {

        const response =
            await fetch(
                ROM_API +
                "&t=" +
                Date.now()
            );

        if (!response.ok)
            throw new Error(
                "HTTP " + response.status
            );

        const files =
            await response.json();

        const roms =
            files
            .filter(file =>
                file.type === "file" &&
                supported(file.name)
            )
            .sort((a,b) =>
                a.name.localeCompare(b.name)
            );


        select.innerHTML = "";

        const first =
            document.createElement("option");

        first.value = "";

        first.textContent =
            "Select a game...";

        select.appendChild(first);


        roms.forEach(file => {

            const option =
                document.createElement("option");

            option.value =
                file.name;

            option.textContent =
                file.name;

            select.appendChild(option);

        });


        status.textContent =
            roms.length +
            " ROM(s) found.";

    }
    catch(error) {

        console.error(error);

        status.textContent =
            "Could not load ROM list.";

    }

}


function startGame() {

    const filename =
        select.value;

    if (!filename) {

        status.textContent =
            "Select a game first.";

        return;

    }


    /*
        EmulatorJS configuration
    */

    EJS_player = "#game";

    EJS_core =
        getSystem().core;

    EJS_gameUrl =
        ROM_PATH +
        filename
        .split("/")
        .map(encodeURIComponent)
        .join("/");

    EJS_pathtodata =
        EJS_DATA;

    EJS_startOnLoaded =
        true;


    const old =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (old)
        old.remove();


    document.getElementById(
        "game"
    ).innerHTML = "";


    status.textContent =
        "Loading " +
        getSystem().core +
        "...";


    const loader =
        document.createElement("script");

    loader.id =
        "emulatorjs-loader";

    loader.src =
        EJS_DATA +
        "loader.js";


    document.body.appendChild(loader);

}


document
.querySelectorAll("[data-system]")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(
                "[data-system]"
            )
            .forEach(b =>
                b.classList.remove("active")
            );

            button.classList.add("active");

            currentSystem =
                button.dataset.system;

            loadROMs();

        }
    );

});


document
.getElementById("play")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("refresh")
.addEventListener(
    "click",
    loadROMs
);


document
.getElementById("reset")
.addEventListener(
    "click",
    () => location.reload()
);


document
.querySelector(
    '[data-system="snes"]'
)
.classList.add("active");


loadROMs();

</script>

</body>
</html>
