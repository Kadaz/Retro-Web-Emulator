<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retro Web Emulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }


        /* ==================================================
           MAIN APP
           ================================================== */

        .app {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 0 0 15px 0;
            text-align: center;
        }


        /* ==================================================
           SYSTEM BUTTONS
           ================================================== */

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .tabs button {
            padding: 11px 16px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .tabs button:hover {
            background: #383838;
        }

        .tabs button.active {
            background: #555;
            outline: 2px solid #aaa;
        }


        /* ==================================================
           PANEL
           ================================================== */

        .panel {
            background: #191919;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
        }


        /* ==================================================
           ROM SELECTOR
           ================================================== */

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        select,
        button {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        select {
            background: #222;
            color: white;
            border: 1px solid #555;
            flex: 1;
            min-width: 300px;
        }

        button {
            background: #292929;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }

        button:hover {
            background: #383838;
        }


        /* ==================================================
           STATUS
           ================================================== */

        #status {
            color: #bbb;
            min-height: 24px;
            padding: 8px 0;
        }


        /* ==================================================
           EMULATOR

           IMPORTANT:
           The emulator is deliberately full width.

           This is the important fix for the EmulatorJS
           bottom toolbar / volume slider.
           ================================================== */

        .screen {
            background: #000;

            margin-top: 12px;

            width: 100vw;

            margin-left: calc(50% - 50vw);

            position: relative;

            overflow: visible;
        }

        #game {
            width: 100%;

            height: calc(100vh - 45px);

            min-height: 480px;

            position: relative;

            overflow: visible;
        }


        /* ==================================================
           INFORMATION
           ================================================== */

        .info {
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 700px) {

            .app {
                padding: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 5px;
            }

            .tabs button {
                padding: 9px 10px;
                font-size: 12px;
            }

            select {
                min-width: 200px;
            }

            #game {
                height: calc(100vh - 45px);
                min-height: 400px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <h1>
        Retro Web Emulator
    </h1>


    <!-- ==================================================
         SYSTEM SELECTION
         ================================================== -->

    <div class="tabs">

        <button data-system="snes">
            SNES
        </button>

        <button data-system="nes">
            NES
        </button>

        <button data-system="segaMS">
            Master System
        </button>

        <button data-system="segaMD">
            Mega Drive / Genesis
        </button>

        <button data-system="segaGG">
            Game Gear
        </button>

        <button data-system="gb">
            Game Boy
        </button>

        <button data-system="gbc">
            Game Boy Color
        </button>

        <button data-system="gba">
            Game Boy Advance
        </button>

    </div>


    <!-- ==================================================
         MAIN PANEL
         ================================================== -->

    <div class="panel">


        <div class="row">

            <select id="romSelect">

                <option value="">
                    Searching ROMs...
                </option>

            </select>


            <button id="load">
                Load ROM
            </button>


            <button id="reset">
                Reset
            </button>

        </div>


        <div id="status">
            Searching the roms folder...
        </div>


        <!-- ==================================================
             EMULATOR
             ================================================== -->

        <div class="screen">

            <div id="game"></div>

        </div>


        <p class="info">

            Keyboard and compatible gamepads are handled by
            EmulatorJS. Save data is handled by the emulator/core.

        </p>


    </div>


</div>


<script>


/*
============================================================
RETRO WEB EMULATOR
============================================================
*/


let selectedSystem = "snes";

let emulatorStarted = false;

let romFiles = [];


/*
============================================================
ELEMENTS
============================================================
*/

const status =
    document.getElementById("status");

const romSelect =
    document.getElementById("romSelect");

const gameContainer =
    document.getElementById("game");


/*
============================================================
SYSTEM INFORMATION
============================================================
*/

const systems = {

    snes: {

        name: "Super Nintendo / SNES",

        core: "snes",

        extensions: [
            ".sfc",
            ".smc",
            ".fig",
            ".gd3",
            ".gd7",
            ".dx2",
            ".bsx",
            ".swc"
        ]

    },


    nes: {

        name: "Nintendo Entertainment System / NES",

        core: "nes",

        extensions: [
            ".nes",
            ".fds",
            ".unif",
            ".unf"
        ]

    },


    segaMS: {

        name: "Sega Master System",

        core: "segaMS",

        extensions: [
            ".sms"
        ]

    },


    segaMD: {

        name: "Sega Mega Drive / Genesis",

        core: "segaMD",

        extensions: [
            ".md",
            ".gen",
            ".smd",
            ".bin"
        ]

    },


    segaGG: {

        name: "Sega Game Gear",

        core: "segaGG",

        extensions: [
            ".gg"
        ]

    },


    gb: {

        name: "Nintendo Game Boy",

        core: "gb",

        extensions: [
            ".gb"
        ]

    },


    gbc: {

        name: "Nintendo Game Boy Color",

        core: "gbc",

        extensions: [
            ".gbc"
        ]

    },


    gba: {

        name: "Nintendo Game Boy Advance",

        core: "gba",

        extensions: [
            ".gba"
        ]

    }

};


/*
============================================================
GET FILE EXTENSION
============================================================
*/

function getExtension(filename) {

    const clean =
        filename
            .split("?")[0]
            .toLowerCase();

    const index =
        clean.lastIndexOf(".");

    if (index === -1) {
        return "";
    }

    return clean.substring(index);

}


/*
============================================================
CHECK IF FILE BELONGS TO SYSTEM
============================================================
*/

function belongsToSystem(filename, systemName) {

    const system =
        systems[systemName];

    const extension =
        getExtension(filename);

    return system.extensions.includes(
        extension
    );

}


/*
============================================================
SORT ROMS
============================================================
*/

function sortRoms(files) {

    return files.sort(
        function(a, b) {

            return a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            );

        }
    );

}


/*
============================================================
SEARCH ROM DIRECTORY
============================================================

This attempts to read:

    /roms/

If Apache/Laragon exposes the directory listing,
the ROMs are detected automatically.

============================================================
*/

async function scanRomsFolder() {

    status.textContent =
        "Searching the roms folder...";


    try {

        const response =
            await fetch(
                "roms/",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const html =
            await response.text();


        /*
        ====================================================
        Parse directory listing
        ====================================================
        */

        const parser =
            new DOMParser();


        const documentHtml =
            parser.parseFromString(
                html,
                "text/html"
            );


        const links =
            documentHtml.querySelectorAll(
                "a"
            );


        const found = [];


        links.forEach(
            function(link) {

                const href =
                    link.getAttribute("href");


                if (!href) {
                    return;
                }


                /*
                Ignore parent directory.
                */

                if (
                    href === "../" ||
                    href === "./"
                ) {

                    return;

                }


                /*
                Only files.
                */

                if (
                    href.endsWith("/")
                ) {

                    return;

                }


                const filename =
                    decodeURIComponent(
                        href
                    );


                /*
                Only supported ROMs.
                */

                let supported =
                    false;


                Object.keys(systems)
                    .forEach(
                        function(systemName) {

                            if (
                                belongsToSystem(
                                    filename,
                                    systemName
                                )
                            ) {

                                supported = true;

                            }

                        }
                    );


                if (!supported) {
                    return;
                }


                found.push({

                    name:
                        filename
                            .split("/")
                            .pop(),

                    url:
                        "roms/" +
                        href

                });

            }
        );


        romFiles =
            sortRoms(found);


        if (romFiles.length === 0) {

            throw new Error(
                "No ROM files were found."
            );

        }


        populateRomList();


        status.textContent =
            "✓ Found " +
            romFiles.length +
            " ROM(s).";


    }
    catch (error) {

        /*
        ====================================================
        Directory listing unavailable.
        ====================================================
        */

        romSelect.innerHTML = "";

        const option =
            document.createElement(
                "option"
            );


        option.value = "";

        option.textContent =
            "Could not automatically scan roms/";


        romSelect.appendChild(
            option
        );


        status.innerHTML =
            "Could not automatically read the roms folder.<br>" +
            "<small>" +
            "If Laragon has directory listing disabled, " +
            "we will use a tiny roms.php scanner instead." +
            "</small>";

    }

}


/*
============================================================
POPULATE ROM LIST
============================================================
*/

function populateRomList() {

    romSelect.innerHTML = "";


    const placeholder =
        document.createElement(
            "option"
        );


    placeholder.value = "";

    placeholder.textContent =
        "-- Select a ROM --";


    romSelect.appendChild(
        placeholder
    );


    romFiles.forEach(
        function(rom) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                rom.url;


            option.textContent =
                rom.name;


            romSelect.appendChild(
                option
            );

        }
    );

}


/*
============================================================
GET SELECTED ROM
============================================================
*/

function getSelectedRom() {

    return romSelect.value;

}


/*
============================================================
START EMULATORJS
============================================================
*/

function loadEmulator(romUrlValue) {

    const system =
        systems[selectedSystem];


    status.textContent =
        "Starting " +
        system.name +
        " emulator...";


    /*
    ========================================================
    EmulatorJS configuration
    ========================================================
    */

    window.EJS_player =
        "#game";


    window.EJS_core =
        system.core;


    window.EJS_gameUrl =
        romUrlValue;


    window.EJS_mouse =
        false;


    window.EJS_multitap =
        false;


    /*
    Default volume.
    */

    window.EJS_volume =
        0.5;


    /*
    ========================================================
    Control scheme
    ========================================================
    */

    window.EJS_controlScheme =
        system.core;


    /*
    ========================================================
    EmulatorJS data
    ========================================================
    */

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    /*
    ========================================================
    Clear previous emulator
    ========================================================
    */

    gameContainer.innerHTML = "";


    /*
    ========================================================
    Remove old loader
    ========================================================
    */

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );


    if (oldLoader) {

        oldLoader.remove();

    }


    /*
    ========================================================
    Load EmulatorJS
    ========================================================
    */

    const script =
        document.createElement(
            "script"
        );


    script.id =
        "emulatorjs-loader";


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function() {

            emulatorStarted = true;


            status.textContent =
                "✓ " +
                system.name +
                " loaded.";

        };


    script.onerror =
        function() {

            status.textContent =
                "✗ Could not load EmulatorJS.";

        };


    document.body.appendChild(
        script
    );

}


/*
============================================================
LOAD BUTTON
============================================================
*/

document
    .getElementById("load")
    .addEventListener(
        "click",
        function() {

            const rom =
                getSelectedRom();


            if (!rom) {

                status.textContent =
                    "Select a ROM first.";

                return;

            }


            loadEmulator(
                new URL(
                    rom,
                    window.location.href
                ).href
            );

        }
    );


/*
============================================================
DOUBLE CLICK ROM
============================================================
*/

romSelect.addEventListener(
    "dblclick",
    function() {

        const rom =
            getSelectedRom();


        if (!rom) {
            return;
        }


        loadEmulator(
            new URL(
                rom,
                window.location.href
            ).href
        );

    }
);


/*
============================================================
RESET
============================================================
*/

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/*
============================================================
SYSTEM BUTTONS
============================================================
*/

document
    .querySelectorAll(
        "[data-system]"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            "[data-system]"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedSystem =
                        button.dataset.system;


                    const system =
                        systems[
                            selectedSystem
                        ];


                    status.textContent =
                        "Selected " +
                        system.name +
                        ".";


                    /*
                    ========================================
                    Filter ROM list
                    ========================================
                    */

                    filterRomList();

                }
            );

        }
    );


/*
============================================================
FILTER ROM LIST BY SYSTEM
============================================================
*/

function filterRomList() {

    romSelect.innerHTML = "";


    const placeholder =
        document.createElement(
            "option"
        );


    placeholder.value = "";

    placeholder.textContent =
        "-- Select " +
        systems[selectedSystem].name +
        " ROM --";


    romSelect.appendChild(
        placeholder
    );


    romFiles
        .filter(
            function(rom) {

                return belongsToSystem(
                    rom.name,
                    selectedSystem
                );

            }
        )
        .forEach(
            function(rom) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    rom.url;


                option.textContent =
                    rom.name;


                romSelect.appendChild(
                    option
                );

            }
        );


    const count =
        romSelect.options.length - 1;


    status.textContent =
        "Found " +
        count +
        " " +
        systems[selectedSystem].name +
        " ROM(s).";

}


/*
============================================================
DEFAULT SYSTEM
============================================================
*/

document
    .querySelector(
        '[data-system="snes"]'
    )
    .classList.add(
        "active"
    );


/*
============================================================
KEYBOARD FIX
============================================================
*/

const emulatorKeys =
    new Set([

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",

        "Enter",
        "Shift",

        "Control",
        "Alt",

        "z",
        "x",
        "a",
        "s",

        "Z",
        "X",
        "A",
        "S",

        " "

    ]);


/*
============================================================
KEY DOWN
============================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
KEY UP
============================================================
*/

document.addEventListener(
    "keyup",
    function(event) {

        if (
            emulatorKeys.has(
                event.key
            )
        ) {

            event.preventDefault();

        }

    },
    false
);


/*
============================================================
START ROM SCAN
============================================================
*/

scanRomsFolder();


</script>

</body>

</html>
